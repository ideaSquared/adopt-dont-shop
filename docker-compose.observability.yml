# ============================================================================
# Self-hosted observability stack — prod/staging overlay (ADS-1041)
# ============================================================================
# Opt-in overlay layered on top of docker-compose.prod.yml / .staging.yml. The
# deploy workflow adds `-f docker-compose.observability.yml` only when the host
# .env sets OBSERVABILITY_ENABLED=true, so existing deploys are unchanged until
# an operator turns it on. Bring it up manually with:
#
#   docker compose -f docker-compose.<env>.yml -f docker-compose.observability.yml \
#     --env-file .env up -d
#
# Services attach to the base file's `default` network (ads-<env>-network), so
# the app services resolve loki/prometheus/tempo/alertmanager by name. The
# operator-facing UIs (Grafana, Prometheus, Alertmanager) bind to host loopback
# (127.0.0.1) only — NOT publicly reachable; reach them via an SSH tunnel (see
# docs/runbooks/observability-enable.md). Loki + Tempo stay internal-only
# (Grafana proxies to them). All app services must have LOKI_URL / OTEL_EXPORTER_
# OTLP_ENDPOINT / SENTRY_DSN set in the host .env for signals to flow.
#
# Config lives under ./observability/ and MUST be provisioned onto the host at
# /opt/ads/<env>/observability/ alongside the compose file (the host holds no
# repo checkout — deploy.yml:517). Images are tag-pinned to match the dev
# `observability` profile; Renovate digest-pins them (ADS-1053).
# ============================================================================

x-obs-logging: &obs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-obs-hardening: &obs-hardening
  restart: always
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *obs-logging

services:
  prometheus:
    <<: *obs-hardening
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # 30d retention covers the 30-day SLO error-budget window (docs/slo.md).
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      # Loopback-only — not publicly reachable; operators reach the UI (Status →
      # Targets / Alerts) via an SSH tunnel. See observability-enable.md.
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.1'
          memory: 128m

  loki:
    <<: *obs-hardening
    image: grafana/loki:3.2.0@sha256:882e30c20683a48a8b7ca123e6c19988980b4bd13d2ff221dfcbef0fdc631694
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.1'
          memory: 128m

  tempo:
    <<: *obs-hardening
    image: grafana/tempo:2.6.1@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"   # Tempo query API (Grafana)
      - "4318"   # OTLP/HTTP ingest (services → OTEL_EXPORTER_OTLP_ENDPOINT)
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.1'
          memory: 128m

  alertmanager:
    <<: *obs-hardening
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      # Loopback-only — not publicly reachable; reach the UI via an SSH tunnel.
      - '127.0.0.1:9093:9093'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9093/-/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.1'
          memory: 64m

  grafana:
    <<: *obs-hardening
    image: grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    # ADS-1376: GF_SECURITY_ADMIN_PASSWORD used to be passed as a plain env
    # var — visible verbatim in this container's `docker inspect` output
    # (Config.Env), which is exactly what cAdvisor's GET /containers/{id}/json
    # access (via docker-socket-proxy, above) can read for *any* container.
    # Routed through a Compose secret instead (file-mounted at
    # /run/secrets/..., which inspect never shows) via Grafana's own
    # `_FILE`-suffix convention for reading a secret from a file
    # (packaging/docker/run.sh in grafana/grafana). The `x-require-...`
    # extension field below preserves the original fail-fast check — it's
    # compose-file metadata only, never part of any container's config.
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Reached via SSH tunnel to localhost; set GF_SERVER_ROOT_URL in the host
      # .env if you front it with a reverse proxy.
      GF_SERVER_ROOT_URL: '${GF_SERVER_ROOT_URL:-http://localhost:3030}'
      # Stay on our own infra — no update checks / usage phone-home.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Loopback-only (host :3030 → container :3000) — not publicly reachable;
      # reach it via an SSH tunnel. Matches GF_SERVER_ROOT_URL's default.
      - '127.0.0.1:3030:3000'
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          cpus: '0.1'
          memory: 64m

  # ==========================================================================
  # HOST / DATASTORE / SYNTHETIC-PROBE EXPORTERS (ADS-1313, ADS-1307).
  # Prometheus previously scraped the 11 app services only — no host disk/
  # memory, no container, no Postgres/Redis, no external-reachability signal.
  # ==========================================================================

  node-exporter:
    <<: *obs-hardening
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    # Host disk/memory/CPU visibility without `network_mode: host` / `pid:
    # host` (which would pull this container off the compose network
    # Prometheus scrapes it on) — mount /proc, /sys and / read-only and point
    # the collectors at them via --path.*. Good enough for HostDiskSpaceLow /
    # HostMemoryPressure; it won't show host-network-interface stats
    # accurately, which this stack doesn't alert on.
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    # ADS-1376: the deploy host materialises production secrets as plaintext
    # files under /opt/ads/<env>/secrets/ (scripts/deploy-secrets.sh), which
    # the /:/host/root:ro mount above would otherwise expose. Shadow that
    # subtree with an empty, unreadable tmpfs — it mounts inside this
    # container's own namespace only, so it doesn't appear in the host's
    # /proc/mounts and has no effect on the "/" filesystem stats the
    # HostDiskSpaceLow alert reads (statfs on a mountpoint is unaffected by
    # mounts nested deeper in its tree). mode=000 plus this stack's
    # `cap_drop: ALL` means not even a root process in the container can
    # bypass it.
    tmpfs:
      - /host/root/opt/ads:size=1k,mode=000
    read_only: true
    expose:
      - '9100'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 32m

  # ADS-1376: the only container with access to the real docker.sock.
  # cAdvisor talks to this proxy instead of the raw socket (see its `command`
  # below), so a compromised cAdvisor process gets this proxy's exact-path
  # allow-list — launching a privileged container, bind-mounting host /, or
  # reading another container's files via GET /containers/{id}/archive (see
  # observability/docker-socket-proxy/server.conf for why a prefix-based ACL
  # — e.g. tecnativa/docker-socket-proxy's CONTAINERS=1 — isn't tight enough
  # to rule that last one out) is a 403 here, instead of the full Docker API
  # a direct, even `:ro`, socket bind-mount would hand it. Also on its own
  # `docker-proxy-internal` network (below), not the shared `default`
  # network every app service sits on, so no *other* compromised container
  # can reach it either. See server.conf for exactly which 5 endpoints are
  # allowed and why cAdvisor needs each one, and nginx.conf (mounted as the
  # main config, not a conf.d fragment) for why its worker process has to
  # run as root.
  docker-socket-proxy:
    <<: *obs-hardening
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/docker-socket-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./observability/docker-socket-proxy/server.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docker-proxy-internal
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,mode=1777
      - /var/run:size=1m,mode=1777
    expose:
      - '2375'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:2375/_ping || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64m
        reservations:
          cpus: '0.02'
          memory: 16m

  cadvisor:
    <<: *obs-hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    # Per-container CPU/memory/restart signal (ContainerRestarting uses
    # container_start_time_seconds). Read-only mounts of the host's cgroup /
    # container metadata; no `privileged`, matching this stack's hardening —
    # some accelerator/device metrics cAdvisor can expose are unavailable
    # without it, which this stack doesn't need.
    # ADS-1376: no /var/run (or docker.sock) mount on cAdvisor itself — see
    # docker-socket-proxy above for why cAdvisor still needs *some* Docker
    # API access, and why it's routed through that proxy instead. Needs
    # both networks: `default` so Prometheus can still scrape it, and
    # `docker-proxy-internal` to reach the proxy, which isn't on `default`.
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    command:
      - '--docker=tcp://docker-socket-proxy:2375'
    networks:
      - default
      - docker-proxy-internal
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    # ADS-1376: shadow /opt/ads/<env>/secrets/* the same way node-exporter
    # does above — /:/rootfs:ro would otherwise expose the plaintext
    # production secrets deploy-secrets.sh writes there. cAdvisor's
    # container_fs_*/machine metrics come from /var/lib/docker and cgroups,
    # not /opt/ads, so this has no effect on what it reports.
    tmpfs:
      - /rootfs/opt/ads:size=1k,mode=000
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m

  postgres-exporter:
    <<: *obs-hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    read_only: true
    # Reuses the same db_password + POSTGRES_USER/POSTGRES_DB the `database`
    # service already takes in docker-compose.prod.yml/.staging.yml — no new
    # credential is provisioned. DATA_SOURCE_URI/_USER/_PASS_FILE (not
    # DATA_SOURCE_NAME) keep the password out of `docker inspect` without
    # needing a shell wrapper. pg_stat_database / pg_settings (the views the
    # default collectors read) are selectable by any role, so the ordinary
    # app DB user is enough — no extra GRANT.
    environment:
      DATA_SOURCE_URI: 'database:5432/${POSTGRES_DB:?Error: POSTGRES_DB required}?sslmode=disable'
      DATA_SOURCE_USER: '${POSTGRES_USER:?Error: POSTGRES_USER required}'
      DATA_SOURCE_PASS_FILE: /run/secrets/db_password
    secrets:
      - db_password
    expose:
      - '9187'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 32m

  redis-exporter:
    <<: *obs-hardening
    # The bare (non-`-alpine`) tag is built FROM scratch and has no shell, so
    # it can't read a secret file into an env var at start. The -alpine tag
    # (same version) has /bin/sh, so the redis/nats-style
    # `sh -c '... "$$(cat /run/secrets/...)"'` file-secret wrapper works —
    # REDIS_PASSWORD never lands in `docker inspect`.
    image: oliver006/redis_exporter:v1.62.0-alpine@sha256:28bbff2343589b76f3b7b171d0103e2603601b53f453e284c75b79eb438d6544
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint: ['sh', '-c']
    command:
      - 'export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; exec /redis_exporter --redis.addr=redis://redis:6379'
    secrets:
      - redis_password
    expose:
      - '9121'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9121/metrics || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 32m

  # External synthetic probe (ADS-1307d). Still runs on the same host as
  # everything it probes — see docs/runbooks/observability-enable.md §7 and
  # the Watchdog alert (infra/prometheus/rules/watchdog.yml) for the
  # off-host signal a same-host probe can't provide (if the host itself is
  # down, this container is down too and can't report anything).
  blackbox-exporter:
    <<: *obs-hardening
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    read_only: true
    expose:
      - '9115'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:9115/-/healthy || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 32m

# ADS-1376: docker-socket-proxy is the only container with access to the
# real docker.sock, so it must not be reachable from the base file's shared
# `default` network every app service also sits on — otherwise any
# compromised app container (not just a compromised cAdvisor) could reach
# it directly. Internal-only: no gateway to the outside, and nothing in the
# base files attaches to it, so only services that explicitly list it below
# (docker-socket-proxy, cadvisor) can reach each other on it.
networks:
  docker-proxy-internal:
    internal: true

volumes:
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local

# db_password/redis_password are declared in docker-compose.prod.yml /
# docker-compose.staging.yml (this overlay is always deployed layered on one
# of them — see the header comment). Redeclared here, pointing at the
# identical host paths, only so
# `docker compose -f docker-compose.observability.yml config` validates this
# file on its own; compose merges identical secret definitions across -f
# files without conflict.
secrets:
  db_password:
    file: ./secrets/db_password
  redis_password:
    file: ./secrets/redis_password
  # ADS-1376: an `environment`-sourced secret, not `file`-sourced like the
  # two above — Grafana's admin password only ever lived in the host .env
  # (GF_SECURITY_ADMIN_PASSWORD), never a materialised file, so this reads
  # it from there and mounts it at /run/secrets/grafana_admin_password
  # without ever passing the value itself into the grafana container's
  # environment (see that service's comment for why that matters).
  grafana_admin_password:
    environment: GF_SECURITY_ADMIN_PASSWORD

# Compose interpolates `x-*` extension fields the same as anything else but
# never attaches them to a container, so this reproduces the fail-fast
# `${VAR:?err}` check GF_SECURITY_ADMIN_PASSWORD used to get directly in the
# grafana service's `environment:` (before routing it through the
# `grafana_admin_password` secret above, whose own `environment:` source
# doesn't fail on a missing var — it would just silently materialise an
# empty secret) without it ever reaching a container's `docker inspect`.
x-require-grafana-admin-password: '${GF_SECURITY_ADMIN_PASSWORD:?Error: GF_SECURITY_ADMIN_PASSWORD required to enable observability}'
