<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Down for maintenance — Adopt Don't Shop</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #f7f5f2;
        color: #2b2b2b;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #55524d;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>We'll be back shortly</h1>
        <p>
          Adopt Don't Shop is temporarily down for scheduled maintenance. Please try again in a
          few minutes.
        </p>
      </div>
    </div>
  </body>
</html>
