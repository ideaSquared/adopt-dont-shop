# ADS-1325: in-stack maintenance-mode fallback (nginx layer), `include`d by
# every SPA vhost in nginx.prod.conf (admin, rescue, client). This is one of
# two independent server-side switches — the other is the gateway's own
# file check (services/gateway/src/middleware/maintenance.ts,
# MAINTENANCE_MODE_FILE) — plus the pre-existing Statsig
# `application_settings.maintenance_mode` dynamic config the frontends read
# for the in-app banner. See docs/runbooks/maintenance-mode.md for the full
# two-layer procedure and which one to use when.
#
# `if` is used here only for a bare `return` — the one use the nginx docs'
# "IfIsEvil" guidance calls safe (the caution is about `if` + `rewrite`/
# `try_files` combinations, not this).
#
# OPERATIONAL NOTE: this `location`/`if` pair is only reachable once
# docker-compose.prod.yml's nginx service mounts (a) this repo's
# nginx/maintenance.html read-only at /srv/maintenance.html, and (b) a
# WRITABLE path for the /srv/maintenance.flag control file — the existing
# `uploads` volume is mounted `:ro` there today, so it cannot host the flag
# as-is. Neither mount exists yet; adding them is a docker-compose.prod.yml
# change out of scope for this change (see the PR description).
if (-f /srv/maintenance.flag) {
    return 503;
}

error_page 503 @maintenance;
location @maintenance {
    internal;
    root /srv;
    rewrite ^ /maintenance.html break;
    include /etc/nginx/security-headers.conf;
}
