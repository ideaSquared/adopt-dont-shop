# ============================================================================
# Test-only override for the production smoke test (scripts/smoke-prod.sh),
# run by the `prod-image-smoke` job in .github/workflows/docker.yml and
# locally via `pnpm smoke:prod`. NOT used by real deploys — deploy.yml never
# references this file.
# ============================================================================
# Layered on top of docker-compose.prod.yml, which runs UNCHANGED otherwise:
# same images, hardening, capabilities, tmpfs mounts and nginx config as a
# real host. Only put something here if it is impossible to have in a test
# run — never to make a production setting pass. This file used to restore
# the database/redis capabilities, the services' corepack cache tmpfs and
# the apps' tmpfs ownership, which hid the fact that the real production
# stack could not start at all; those fixes now live in
# docker-compose.prod.yml itself.
services:
  # No real provider credentials in a test run. Ethereal is a throwaway SMTP
  # sink; the FCM JSON comes from the throwaway fcm_service_account_json
  # secret the smoke script writes (the right shape — no push is ever sent).
  # Do NOT also set FCM_SERVICE_ACCOUNT_JSON inline: readSecret() refuses to
  # boot when both the direct and _FILE variants are present.
  service-notifications:
    environment:
      EMAIL_PROVIDER: ethereal
