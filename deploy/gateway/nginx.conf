            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # HTTP → HTTPS redirect for known hostnames only. [ADS-1300]
    # =========================================================================
    server {
        listen 80;
        server_name adoptdontshop.app www.adoptdontshop.app api.adoptdontshop.app
            admin.adoptdontshop.app rescue.adoptdontshop.app staging.adoptdontshop.app
            staging-api.adoptdontshop.app staging-admin.adoptdontshop.app
            staging-rescue.adoptdontshop.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
