# Staging serves /uploads directly through the backend. The gateway has no
# static file handler for this raw path (only POST /api/v1/uploads/images and
# GET /uploads-signed/*), so a request here 404s today for every category —
# harmless for `pets` (nothing relies on it) and, since ADS-1034, also safe
# for `documents`: private files are only ever handed out as signed URLs
# (below), never as a raw /uploads/ path.
location /uploads/ {
    proxy_pass http://staging_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ADS-915: this file is the public edge — overwrite XFF with the real
    # connecting IP rather than appending, so a client can't spoof it (the
    # gateway keys security logic, e.g. the WS handshake limiter, on XFF).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

# ADS-1034: the gateway's own signed-serve route (GET /uploads-signed/*,
# services/gateway/src/routes/uploads.ts) — an HMAC-signed, short-lived URL
# minted per request after the gateway's own authorization check passes.
location /uploads-signed/ {
    proxy_pass http://staging_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ADS-915: this file is the public edge — overwrite XFF with the real
    # connecting IP rather than appending, so a client can't spoof it (the
    # gateway keys security logic, e.g. the WS handshake limiter, on XFF).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
