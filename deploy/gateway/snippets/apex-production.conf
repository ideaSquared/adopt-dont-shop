    # =========================================================================
    # PRODUCTION — Main client (apex + www)
    # =========================================================================
    # Included by nginx.conf once production launches (see the apex include
    # there). Restored from the vhost that preceded the landing page, with the
    # SPA CSP and the credential rate limit updated to match the sibling vhosts.
    server {
        listen 443 ssl http2;
        server_name adoptdontshop.app www.adoptdontshop.app;

        ssl_certificate /etc/letsencrypt/live/adoptdontshop.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adoptdontshop.app/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Fonts, Statsig and hosted Sentry are allowed so the SPAs work (see
        # scripts/check-csp-headers.mjs). A self-hosted GlitchTip DSN host would
        # need adding to connect-src. The app container sets its own CSP too;
        # browsers enforce both, so keep the two in step.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.adoptdontshop.app wss://api.adoptdontshop.app https://featureassets.org https://prodregistryv2.org https://statsigapi.net https://*.ingest.sentry.io https://*.ingest.de.sentry.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        include /etc/nginx/snippets/uploads-prod.conf;

        # API proxy — allows frontend to use relative URLs (VITE_API_BASE_URL="")
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Strict per-IP limit on credential endpoints only. The SPAs call
        # /api/v1/auth/*, so this must match under /api/ — not a bare /auth/
        # (the gateway has no such routes). refresh-token, /me and logout stay
        # on the normal api zone: 5r/m there would lock signed-in users out.
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location /socket.io/ {
            limit_req zone=socketio burst=10 nodelay;
            proxy_pass http://$prod_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://$prod_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
