# SSL parameters — modern config (Mozilla intermediate)
# Mount this file into the nginx container at /etc/nginx/snippets/ssl-params.conf

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

ssl_stapling on;
ssl_stapling_verify on;
# Docker's embedded DNS, not public resolvers: this snippet is included in
# every TLS server block, so its resolver also resolves the container names
# behind proxy_pass (see "UPSTREAMS" in nginx.conf). It forwards outside
# names (the OCSP responder for stapling) to the host's own resolvers.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
