# Staging is private: an allowlisted IP gets straight in, anyone else must
# pass HTTP basic auth. Included at server level in every staging vhost of
# deploy/gateway/nginx.conf (scripts/check-gateway-staging-access.mjs fails
# CI if one is missing).
#
# Both files live on the host only, never in git, under
# /opt/ads/gateway/staging-access/ (mounted read-only by
# docker-compose.gateway.yml):
#   *.allow   one `allow <ip-or-cidr>;` per line, e.g. `allow 203.0.113.7;`
#   htpasswd  created with `htpasswd -B -c htpasswd <user>`
# Setup steps: docs/infrastructure/DEPLOYMENT-PLAN.md, "Private staging".
#
# Fail-closed: with no *.allow file and no htpasswd, nginx still starts, and
# every staging request is refused (403/500).
#
# $remote_addr is the real client IP because this gateway is the public edge
# (see ADS-915 in nginx.conf). Never allowlist Docker or private ranges.
satisfy any;
include /etc/nginx/staging-access/*.allow;
deny all;

auth_basic "Adopt Don't Shop staging";
auth_basic_user_file /etc/nginx/staging-access/htpasswd;

# Keep staging out of search engines even if a URL leaks.
add_header X-Robots-Tag "noindex, nofollow" always;
