    # =========================================================================
    # PRE-LAUNCH — Landing page + waiting list (apex + www)
    # =========================================================================
    # Serves the static landing page in deploy/gateway/landing/ (mounted by
    # docker-compose.gateway.yml) instead of proxying to the production client
    # app. Included by nginx.conf until launch; see the apex include there.
    #
    # The waiting-list form posts straight to the email provider, so the
    # provider's origin must be added to form-action below when the form is
    # switched on (see the comment in landing/index.html).
    server {
        listen 443 ssl http2;
        server_name adoptdontshop.app www.adoptdontshop.app;

        ssl_certificate /etc/letsencrypt/live/adoptdontshop.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adoptdontshop.app/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        root /usr/share/nginx/landing;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
