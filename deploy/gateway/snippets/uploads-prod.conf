# /uploads is served by the per-stack nginx directly from the shared volume
# — the gateway just forwards it on. [ADS-422]
#
# ADS-1034: the auth_request gate the per-stack nginx (nginx/nginx.prod.conf)
# used to run in front of this proxied path pointed at a backend endpoint
# that was never implemented, mapping every /uploads/ request to a 500. That
# gate is gone; the per-stack nginx now denies /uploads/documents/ outright
# and serves everything else (public categories only) unauthenticated. The
# private `documents` category is only ever reachable via the signed route
# below.
location /uploads/ {
    proxy_pass http://prod_nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ADS-915: this file is the public edge — overwrite XFF with the real
    # connecting IP rather than appending, so a client can't spoof it (the
    # gateway keys security logic, e.g. the WS handshake limiter, on XFF).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

# ADS-1034: the gateway's own signed-serve route (GET /uploads-signed/*,
# services/gateway/src/routes/uploads.ts) — an HMAC-signed, short-lived URL
# minted per request after the gateway's own authorization check passes.
# This is the only path a private (`documents`-category) file is ever
# reachable through, so it's routed straight to the backend, not the
# per-stack nginx.
location /uploads-signed/ {
    proxy_pass http://prod_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ADS-915: this file is the public edge — overwrite XFF with the real
    # connecting IP rather than appending, so a client can't spoof it (the
    # gateway keys security logic, e.g. the WS handshake limiter, on XFF).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
