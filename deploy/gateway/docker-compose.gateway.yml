# Gateway — single nginx that routes all domains to correct stack
# Lives at /opt/ads/gateway/ on the server
# Joins the prod Docker network. A host that also runs staging layers in
# docker-compose.gateway.staging.yml to join the staging network too:
#   docker compose -f docker-compose.gateway.yml -f docker-compose.gateway.staging.yml up -d
# Both networks are created by their app stacks, so deploy the app stack(s)
# before starting the gateway.

services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: ads_gateway
    restart: always
    # certbot renews into the shared volume but cannot signal nginx, and nginx
    # only reads certificates at start/reload — without this loop it keeps
    # serving the old certificate until it expires. A reload is graceful (no
    # dropped connections) and a no-op when nothing changed.
    command:
      - /bin/sh
      - -c
      - 'while :; do sleep 12h; nginx -s reload; done & exec nginx -g "daemon off;"'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # The whole directory: nginx.conf also includes uploads-prod.conf and
      # uploads-staging.conf from here, and refuses to start without them.
      - ./snippets:/etc/nginx/snippets:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - ads-prod-network
    cap_drop:
      - ALL
    # CHOWN/SETUID/SETGID: the stock nginx image starts as root, chowns its
    # temp dirs and drops its workers to the `nginx` user — without them it
    # exits at boot (`chown("/var/cache/nginx/client_temp", 101) failed`).
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t 2>/dev/null && test -f /var/run/nginx.pid']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256m
        reservations:
          cpus: '0.1'
          memory: 64m

  certbot:
    image: certbot/certbot:v3.1.0@sha256:fb978b4fef92dc5c85cc0b908836714c600e717b52a3f74c93276eb63a9d0af9
    container_name: ads_certbot
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  certbot_webroot:
  letsencrypt:

networks:
  ads-prod-network:
    external: true
