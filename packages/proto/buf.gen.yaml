# Hermetic codegen — the ts-proto plugin runs from node_modules/.bin, no
# buf.build remote. CAD lesson: the dev environment couldn't reach
# buf.build (403 from a non-browser client), and CI is even more
# locked-down. Local plugin = `pnpm install && buf generate` works
# anywhere.
version: v1
plugins:
  - plugin: ts_proto
    # Invoke ts-proto's plugin script via `node` directly rather than the
    # node_modules/.bin shim — the .bin shim has no extension on Windows
    # (only .CMD/.ps1 wrappers do), which cmd.exe can't exec. `node <path
    # to .js>` works identically on every platform.
    path: [node, node_modules/ts-proto/protoc-gen-ts_proto]
    out: src/generated
    opt:
      # ES module interop so consumers can `import { ... }` cleanly.
      - esModuleInterop=true
      # ESM-style explicit `.js` import suffix — required by Node's
      # NodeNext / bundler module resolution when emitting ESM.
      - importSuffix=.js
      # Message fields are TS optional (more idiomatic; matches how proto3
      # already treats unset scalars).
      - useOptionals=messages
      # JSON helpers — useful for the gateway's REST→gRPC translation
      # layer.
      - outputJsonMethods=true
      # gRPC-js service stubs — both server-side Definition tables and
      # client constructors are emitted. Brings @grpc/grpc-js as a
      # runtime dep on this package; services that consume the package
      # get it transitively. Flipped on in Phase 1.3 once
      # service.notifications brought the first real service surface.
      - outputServices=grpc-js
