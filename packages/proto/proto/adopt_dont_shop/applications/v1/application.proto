syntax = "proto3";

package adopt_dont_shop.applications.v1;

import "proto/adopt_dont_shop/v1/options.proto";

// ApplicationService is the gRPC contract for the applications
// vertical — the EVENT-SOURCED extraction. Owns the `applications.*`
// schema (Application, ApplicationDraft, ApplicationAnswer,
// ApplicationTimelineEntry, HomeVisit, Reference) and exposes the
// command + query split CAD's incident service pioneered.
//
// Commands are the only mutation entry points; each one validates
// invariants against the pure domain (Phase 5.2), appends an event
// to the Postgres event store, denormalises into the read model, and
// publishes the corresponding `applications.*` subject AFTER commit.
// Queries read the denormalised projection.
//
// State machine (the canonical lifecycle):
//
//   draft → submitted → under_review → home_visit_scheduled →
//   home_visit_completed → approved | rejected | withdrawn → adopted
//
// Plus self-loops `under_review` → `under_review` for additional
// answers/references, and `withdrawn` as a terminal exit from
// `draft` / `submitted` / `under_review` at any point.
service ApplicationService {
  // Mint a fresh draft for an adopter applying to a specific pet.
  // Caller MUST be the adopter (own user_id) or super_admin.
  // Publishes `applications.draftCreated` after commit.
  rpc StartDraft(StartDraftRequest) returns (StartDraftResponse);

  // Persist answers / reference contacts to an existing draft.
  // Idempotent on (application_id, version) — the read model
  // checks optimistic concurrency. Caller MUST be the adopter or
  // super_admin.
  rpc SaveDraftAnswers(SaveDraftAnswersRequest) returns (SaveDraftAnswersResponse);

  // Transition draft → submitted. Validates that all required core
  // questions plus the rescue's required questions are answered.
  // Publishes `applications.submitted` after commit — the
  // notifications service consumes this and pings both the adopter
  // and rescue staff.
  rpc SubmitDraft(SubmitDraftRequest) returns (SubmitDraftResponse);

  // Transition submitted → under_review (rescue staff opens the
  // application for review). Idempotent — repeat calls return the
  // current row. Caller MUST be rescue staff scoped to the
  // application's rescue.
  rpc StartReview(StartReviewRequest) returns (StartReviewResponse);

  // Transition under_review → home_visit_scheduled. Carries the
  // scheduled timestamp + visitor name. Publishes
  // `applications.homeVisitScheduled`.
  rpc ScheduleHomeVisit(ScheduleHomeVisitRequest) returns (ScheduleHomeVisitResponse);

  // Transition home_visit_scheduled → home_visit_completed. Carries
  // the home_visit notes + outcome. Publishes
  // `applications.homeVisitCompleted`.
  rpc CompleteHomeVisit(CompleteHomeVisitRequest) returns (CompleteHomeVisitResponse);

  // Terminal: approve the application. Carries optional notes for
  // the adopter. Publishes `applications.approved`.
  rpc Approve(ApproveRequest) returns (ApproveResponse);

  // Terminal: reject with a reason. Publishes
  // `applications.rejected`.
  rpc Reject(RejectRequest) returns (RejectResponse);

  // Terminal (adopter-initiated): withdraw an application from any
  // pre-decision state. Publishes `applications.withdrawn`.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);

  // Final-terminal: mark the pet adopted. Triggered when the
  // service.pets `pets.statusChanged → adopted` event references
  // this application, OR via a manual admin override. Publishes
  // `applications.adopted`.
  rpc MarkAdopted(MarkAdoptedRequest) returns (MarkAdoptedResponse);

  // Read-side: fetch a single application's current projected state
  // (status + answers + timeline). NOT_FOUND when missing or soft-
  // deleted.
  rpc Get(GetApplicationRequest) returns (GetApplicationResponse);

  // Read-side: keyset paginated list, scoped by status or rescue
  // for the adopter / staff dashboards. Adopters see their own;
  // staff see their rescue's; admins see all.
  rpc List(ListApplicationsRequest) returns (ListApplicationsResponse);

  // Read-side: application counts grouped by status, scoped the same
  // way List is (adopters see their own; staff see their rescue's;
  // admins see all and may narrow by rescue/adopter). Powers the
  // rescue dashboard's stats cards. Returns RAW per-service-status
  // counts — the gateway collapses them to the SPA's 4-state shape.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // Read-side: cross-service attribution count (ADS-941). Given a
  // caller-supplied set of adopter user ids (e.g. an event's
  // registrants, resolved by the calling service), returns how many of
  // them have at least one application that reached APPROVED or
  // ADOPTED status with actioned_at (ADS-1025 — when the application
  // reached that status, not when it was created) inside
  // [actioned_after, actioned_before], optionally narrowed to one
  // rescue (ADS-1023). Deliberately narrow: the caller already knows
  // the adopter_ids (it resolved them itself); the response reveals
  // only the count, never which ids matched or which rescue/pet was
  // involved. Caller MUST hold ANALYTICS_VIEW (admin.reports) — an
  // admin-only reporting permission, NOT applications.read, which
  // every adopter is seeded (ADS-1006). adopter_ids is capped at
  // 10,000 entries (ADS-1024) — rejected with INVALID_ARGUMENT above
  // that.
  rpc CountAdoptedAdopters(CountAdoptedAdoptersRequest) returns (CountAdoptedAdoptersResponse);

  // Document metadata — append a row referencing an already-stored
  // file URL. The gateway owns the multipart upload + object storage;
  // this surface only persists the METADATA. Caller MUST hold
  // applications.update for the application's rescue.
  rpc AddDocument(AddDocumentRequest) returns (AddDocumentResponse);

  // Document metadata — list the non-deleted documents attached to an
  // application, scoped the same way Get is (adopter-owns OR rescue-
  // staff-of-the-app's-rescue OR admin).
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

  // Document metadata — soft-delete one document. Caller MUST hold
  // applications.update for the application's rescue.
  rpc RemoveDocument(RemoveDocumentRequest) returns (RemoveDocumentResponse);

  // Adopter's reusable application defaults (personal info / living
  // situation / pet experience / references) used to pre-populate new
  // applications. Always scoped to the calling principal's own
  // user_id — there is no cross-adopter read or write.
  rpc GetApplicationDefaults(GetApplicationDefaultsRequest)
      returns (GetApplicationDefaultsResponse);

  // Deep-merge a partial defaults patch into the adopter's saved
  // defaults and return the merged result. Top-level keys absent from
  // the patch are left untouched.
  rpc UpdateApplicationDefaults(UpdateApplicationDefaultsRequest)
      returns (UpdateApplicationDefaultsResponse);

  // Backend-synced application DRAFT for a (caller, pet) pair — the
  // autosave scratchpad the SPA writes while the adopter fills out the
  // form, distinct from the event-sourced draft Application above. Always
  // scoped to the calling principal's own user_id. `found` is false when
  // the adopter has no draft for that pet (the SPA starts fresh).
  rpc GetApplicationDraft(GetApplicationDraftRequest)
      returns (GetApplicationDraftResponse);

  // Upsert the (caller, pet) draft — last-write-wins, stamping a fresh
  // 30-day TTL on every write.
  rpc SaveApplicationDraft(SaveApplicationDraftRequest)
      returns (SaveApplicationDraftResponse);

  // Delete the (caller, pet) draft. Idempotent — deleting a draft that
  // isn't there succeeds (the SPA calls this best-effort on submit).
  rpc DeleteApplicationDraft(DeleteApplicationDraftRequest)
      returns (DeleteApplicationDraftResponse);

  // --- Home visit scheduling detail (ADS-1152) ------------------------
  //
  // The granular per-visit scheduling lifecycle (scheduled → in_progress
  // → completed | cancelled), backed by the home_visits /
  // home_visit_status_transitions tables — non-aggregate operational
  // detail alongside the event-sourced Application's single-visit
  // summary (home_visit_scheduled_at / outcome / notes above). A row is
  // created by ScheduleHomeVisit the first time a visit is scheduled.

  // List the home-visit rows for an application, newest first. Scoped
  // like Get (adopter-owns OR rescue-staff-of-the-app's-rescue OR admin).
  rpc ListHomeVisits(ListHomeVisitsRequest) returns (ListHomeVisitsResponse);

  // Drive a home visit's granular status machine (start / reschedule /
  // cancel / complete) plus its notes/outcome. Every status change is
  // appended to home_visit_status_transitions; the DB trigger
  // (migration 006) propagates it onto home_visits.status. Caller MUST
  // hold applications.review scoped to the application's rescue.
  rpc UpdateHomeVisit(UpdateHomeVisitRequest) returns (UpdateHomeVisitResponse);

  // --- Applicant application preferences (ADS-1140) -------------------
  //
  // Feature-toggle preferences (auto-populate, quick-apply, reminders) —
  // distinct from GetApplicationDefaults' saved form-answer data. Always
  // scoped to the calling principal's own user_id.

  rpc GetApplicationPreferences(GetApplicationPreferencesRequest)
      returns (GetApplicationPreferencesResponse);

  rpc UpdateApplicationPreferences(UpdateApplicationPreferencesRequest)
      returns (UpdateApplicationPreferencesResponse);

  // --- Reference checks (ADS-1140) -------------------------------------
  //
  // Minimal-viable reference-check workflow: rescue staff record the
  // contact outcome for a referee named on the application. The referee
  // list itself stays the event-sourced Application.references_json;
  // this only tracks operational status ABOUT a referee (pending →
  // contacted → completed | failed), so it's plain non-aggregate data.

  rpc UpdateReferenceCheck(UpdateReferenceCheckRequest) returns (UpdateReferenceCheckResponse);

  // --- Timeline notes (ADS-1139) ---------------------------------------
  //
  // Free-text notes rescue staff attach to an application's timeline —
  // separate from the event-sourced status-transition timeline
  // (GetApplication's include_timeline), which the gateway composes
  // these with for the SPA's combined timeline view.

  rpc AddTimelineNote(AddTimelineNoteRequest) returns (AddTimelineNoteResponse);

  rpc ListTimelineNotes(ListTimelineNotesRequest) returns (ListTimelineNotesResponse);
}

// --- ENUMs — value lists mirror the Postgres types verbatim ----------

enum ApplicationStatus {
  APPLICATION_STATUS_UNSPECIFIED = 0;
  APPLICATION_STATUS_DRAFT = 1;
  APPLICATION_STATUS_SUBMITTED = 2;
  APPLICATION_STATUS_UNDER_REVIEW = 3;
  APPLICATION_STATUS_HOME_VISIT_SCHEDULED = 4;
  APPLICATION_STATUS_HOME_VISIT_COMPLETED = 5;
  APPLICATION_STATUS_APPROVED = 6;
  APPLICATION_STATUS_REJECTED = 7;
  APPLICATION_STATUS_WITHDRAWN = 8;
  APPLICATION_STATUS_ADOPTED = 9;
}

enum HomeVisitOutcome {
  HOME_VISIT_OUTCOME_UNSPECIFIED = 0;
  HOME_VISIT_OUTCOME_PASSED = 1;
  HOME_VISIT_OUTCOME_FAILED = 2;
  HOME_VISIT_OUTCOME_RESCHEDULE = 3;
}

// --- Application — denormalised read-model row -----------------------

message Application {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string adopter_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string pet_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string rescue_id = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  ApplicationStatus status = 5;
  // JSON-stringified key→value answers map. Empty string == `{}`.
  string answers_json = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // JSON-stringified reference contact list. Empty string == `[]`.
  string references_json = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // Optimistic-concurrency version — bumped on every event append.
  uint32 version = 8;
  optional string submitted_at = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string review_started_at = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string home_visit_scheduled_at = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string home_visit_completed_at = 12 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional HomeVisitOutcome home_visit_outcome = 13;
  optional string home_visit_notes = 14 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string decided_at = 15 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string decided_by = 16 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string decision_notes = 17 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string rejection_reason = 18 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string adopted_at = 19 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string created_at = 20 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 21 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

// TimelineEntry mirrors the applications.application_timeline_entries
// audit row — every event-store row gets a denormalised entry the SPA
// renders chronologically.
message TimelineEntry {
  string entry_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string application_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  ApplicationStatus from_status = 3;
  ApplicationStatus to_status = 4;
  string actor_user_id = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string occurred_at = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string note = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

// --- StartDraft ------------------------------------------------------

message StartDraftRequest {
  // adopter_id MUST match the calling principal (adopters own their
  // drafts). super_admin can pass any.
  string adopter_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string pet_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message StartDraftResponse {
  Application application = 1;
}

// --- SaveDraftAnswers ------------------------------------------------

message SaveDraftAnswersRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optimistic-concurrency guard — the caller's last-known version.
  // The service rejects with FAILED_PRECONDITION when the row has
  // moved beyond this version.
  uint32 expected_version = 2;
  // JSON-stringified answers patch. The handler merges this into
  // the existing answers map (NOT replace) so callers can save
  // partial progress.
  string answers_patch_json = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // Optional reference contact list replacement (wholesale). Empty
  // string = leave unchanged.
  optional string references_json = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message SaveDraftAnswersResponse {
  Application application = 1;
}

// --- SubmitDraft -----------------------------------------------------

message SubmitDraftRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  uint32 expected_version = 2;
}

message SubmitDraftResponse {
  Application application = 1;
}

// --- StartReview -----------------------------------------------------

message StartReviewRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optional staff note ("opening for review").
  optional string note = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message StartReviewResponse {
  Application application = 1;
}

// --- ScheduleHomeVisit -----------------------------------------------

message ScheduleHomeVisitRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string scheduled_at = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optional pre-visit note (visitor name, preferences, etc.).
  optional string note = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message ScheduleHomeVisitResponse {
  Application application = 1;
}

// --- CompleteHomeVisit -----------------------------------------------

message CompleteHomeVisitRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  HomeVisitOutcome outcome = 2;
  optional string notes = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message CompleteHomeVisitResponse {
  Application application = 1;
}

// --- Approve / Reject / Withdraw / MarkAdopted -----------------------

message ApproveRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message ApproveResponse {
  Application application = 1;
}

message RejectRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string reason = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message RejectResponse {
  Application application = 1;
}

message WithdrawRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string reason = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message WithdrawResponse {
  Application application = 1;
}

message MarkAdoptedRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message MarkAdoptedResponse {
  Application application = 1;
}

// --- Get -------------------------------------------------------------

message GetApplicationRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Set true to include the timeline projection in the response.
  // Defaults false to keep the GET cheap when the SPA already has
  // the timeline cached.
  bool include_timeline = 2;
}

message GetApplicationResponse {
  Application application = 1;
  repeated TimelineEntry timeline = 2;
}

// --- List ------------------------------------------------------------

message ListApplicationsRequest {
  // Opaque base64-JSON keyset cursor.
  optional string cursor = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Defaults to 20, max 100.
  uint32 limit = 2;
  // Optional filters. UNSPECIFIED in each enum = "no filter".
  ApplicationStatus status_filter = 3;
  optional string rescue_id_filter = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Adopters can only see their own (the handler enforces scope
  // from principal.userId); admins + super_admin can pass any
  // adopter_id_filter explicitly.
  optional string adopter_id_filter = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Offset pagination for the staff / admin applications datatable. When
  // set (>0) the handler returns an OFFSET page plus a real `total`
  // (COUNT) instead of a keyset cursor, so the shared DataTable can render
  // "Page X of Y". The principal scope (adopter-owns / rescue-staff /
  // admin) still applies — offset mode never widens what a caller sees.
  optional uint32 page = 6;
}

message ListApplicationsResponse {
  repeated Application applications = 1;
  optional string next_cursor = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Total row count for the current filter — present only in offset mode
  // (page set). Keyset responses omit it.
  optional uint32 total = 3;
}

// --- GetStats --------------------------------------------------------

message GetStatsRequest {
  // Optional filters. Admins + super_admin may pass either to narrow
  // the counted set; rescue staff are pinned to their own rescue and
  // adopters to their own user id regardless of these (the handler
  // enforces scope from the principal).
  optional string rescue_id_filter = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string adopter_id_filter = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Inclusive lower / upper bounds on created_at. Used by the report
  // builder's "application funnel" widget to scope counts to the
  // report's date-range filter; omit either for an open-ended range.
  optional string created_after = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string created_before = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message GetStatsResponse {
  // Total non-deleted applications in scope (sum of the per-status
  // counts below).
  uint32 total = 1;
  // RAW per-service-status counts — zero-filled for statuses with no
  // rows. The gateway collapses these to the SPA's 4-state shape.
  uint32 draft = 2;
  uint32 submitted = 3;
  uint32 under_review = 4;
  uint32 home_visit_scheduled = 5;
  uint32 home_visit_completed = 6;
  uint32 approved = 7;
  uint32 rejected = 8;
  uint32 withdrawn = 9;
  uint32 adopted = 10;
}

// --- CountAdoptedAdopters ---------------------------------------------

message CountAdoptedAdoptersRequest {
  // Candidate adopter user ids to check — e.g. an event's registrant
  // list, resolved by the calling service. No filter/scope semantics
  // beyond the optional rescue_id below; the caller decides which ids
  // are in play. Capped at 10,000 entries (ADS-1024) — the handler
  // rejects anything above that with INVALID_ARGUMENT before querying.
  repeated string adopter_ids = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Inclusive lower bound (RFC3339) on the application's actioned_at —
  // when it reached APPROVED/ADOPTED status (ADS-1025). Renamed from
  // created_after: the documented attribution rule was always "reached
  // APPROVED/ADOPTED within the window", not "created within the
  // window". Required; must parse as a valid date and must not be
  // after actioned_before.
  string actioned_after = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Inclusive upper bound (RFC3339) on actioned_at. See actioned_after.
  string actioned_before = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optional rescue scope (ADS-1023). When set, only applications
  // owned by this rescue count towards the distinct-adopter total —
  // e.g. an event's attribution count should only reflect adoptions at
  // the rescue that ran the event. Omit for an unscoped, cross-rescue
  // count.
  optional string rescue_id = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message CountAdoptedAdoptersResponse {
  // Distinct count of adopter_ids (from the request) with at least one
  // non-deleted application whose status is APPROVED or ADOPTED, whose
  // actioned_at (when it reached that status) falls in
  // [actioned_after, actioned_before], and — when rescue_id was
  // supplied — that belongs to that rescue.
  uint32 count = 1;
}

// --- Documents -------------------------------------------------------

// Document — metadata for a file attached to an application. The file
// bytes live in object storage (owned by the gateway); this row only
// references the stored `url`. Mirrors the SPA's Document shape.
message Document {
  string document_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string application_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string type = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string filename = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string url = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional uint32 size = 6;
  optional string mime_type = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string uploaded_at = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message AddDocumentRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string type = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string filename = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // URL of the already-stored file (the caller owns the upload).
  string url = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional uint32 size = 5;
  optional string mime_type = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message AddDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message RemoveDocumentRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string document_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message RemoveDocumentResponse {}

// --- Application defaults ---------------------------------------------

message GetApplicationDefaultsRequest {}

message GetApplicationDefaultsResponse {
  // JSON-stringified ApplicationDefaults. Empty string when the adopter
  // has never saved any defaults.
  string defaults_json = 1;
}

message UpdateApplicationDefaultsRequest {
  // JSON-stringified partial ApplicationDefaults patch, deep-merged
  // into the stored value.
  string defaults_patch_json = 1;
}

message UpdateApplicationDefaultsResponse {
  // JSON-stringified ApplicationDefaults after the merge.
  string defaults_json = 1;
}

// --- Application drafts (autosave scratchpad) ------------------------

message GetApplicationDraftRequest {
  string pet_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message GetApplicationDraftResponse {
  // False when the caller has no draft for this pet. The other fields
  // are unset / empty in that case.
  bool found = 1;
  // JSON-stringified answers map. Empty string == `{}`.
  string answers_json = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string updated_at = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // TTL — when the daily purge will reap the row. Unset when the row
  // carries no expiry.
  optional string expires_at = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message SaveApplicationDraftRequest {
  string pet_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // JSON-stringified answers map. Stored verbatim (last-write-wins).
  string answers_json = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message SaveApplicationDraftResponse {
  string answers_json = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string updated_at = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string expires_at = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeleteApplicationDraftRequest {
  string pet_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeleteApplicationDraftResponse {}

// --- Home visits (ADS-1152) -------------------------------------------

// HomeVisitRecord — a home_visits row. status / outcome are plain
// strings (not enums) matching the Postgres ENUM values verbatim:
// status ∈ {scheduled, in_progress, completed, cancelled}; outcome ∈
// {approved, rejected, conditional}.
message HomeVisitRecord {
  string visit_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string application_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // ISO date (YYYY-MM-DD).
  string scheduled_date = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // ISO time (HH:MM:SS).
  string scheduled_time = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string assigned_staff = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string status = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string outcome = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string outcome_notes = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string reschedule_reason = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string cancelled_reason = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string completed_at = 12 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string created_at = 13 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 14 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListHomeVisitsRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListHomeVisitsResponse {
  repeated HomeVisitRecord visits = 1;
}

message UpdateHomeVisitRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string visit_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Target status. Omit to update fields without transitioning status
  // (e.g. a reschedule that stays 'scheduled').
  optional string status = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string scheduled_date = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string scheduled_time = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string assigned_staff = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string outcome = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string outcome_notes = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string reschedule_reason = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string cancelled_reason = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string completed_at = 12 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message UpdateHomeVisitResponse {
  HomeVisitRecord visit = 1;
}

// --- Application preferences (ADS-1140) --------------------------------

message GetApplicationPreferencesRequest {}

message GetApplicationPreferencesResponse {
  // JSON-stringified ApplicationPreferences. Empty string when the
  // adopter has never saved any (the gateway fills in defaults).
  string preferences_json = 1;
}

message UpdateApplicationPreferencesRequest {
  // JSON-stringified partial ApplicationPreferences patch, deep-merged
  // into the stored value.
  string preferences_patch_json = 1;
}

message UpdateApplicationPreferencesResponse {
  string preferences_json = 1;
}

// --- Reference checks (ADS-1140) ---------------------------------------

message ReferenceCheck {
  // The referee's stable key within the application's references list
  // (e.g. "ref-0") — matches the frontend's array-index id scheme.
  string reference_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string application_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string name = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string email = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string relationship = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // pending | contacted | completed | failed.
  string status = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contacted_at = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string contacted_by = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message UpdateReferenceCheckRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string reference_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string status = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contacted_at = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message UpdateReferenceCheckResponse {
  ReferenceCheck reference = 1;
}

// --- Timeline notes (ADS-1139) ------------------------------------------

message TimelineNote {
  string note_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string application_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string title = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string description = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string note_type = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // JSON-stringified free-form metadata. Empty string == `{}`.
  string metadata_json = 6;
  string created_by = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string created_at = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message AddTimelineNoteRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string title = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string description = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string note_type = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // JSON-stringified free-form metadata. Empty/omitted == `{}`.
  optional string metadata_json = 5;
}

message AddTimelineNoteResponse {
  TimelineNote note = 1;
}

message ListTimelineNotesRequest {
  string application_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListTimelineNotesResponse {
  repeated TimelineNote notes = 1;
}
