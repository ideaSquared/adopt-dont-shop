syntax = "proto3";

package adopt_dont_shop.demo.v1;

import "proto/adopt_dont_shop/v1/options.proto";

// DemoService creates and removes throwaway rescues for testing in dev and
// staging. No service process serves it over gRPC: service.ops handles it
// in-process (services/ops/src/demo-rescue.ts) by calling the existing auth,
// rescue and pets RPCs in order. It is defined here so the ops catalog,
// request validation and response masking work exactly as for any other
// command. service.ops refuses both RPCs in prod.
service DemoService {
  // Create a verified rescue with an active owner account and sample pets.
  // The owner's generated password is returned once in the response.
  rpc CreateRescue(CreateRescueRequest) returns (CreateRescueResponse);

  // Remove a rescue made by CreateRescue: soft-delete its pets and the
  // rescue, then deactivate its owner. Refuses rescues it did not create.
  rpc DeleteRescue(DeleteRescueRequest) returns (DeleteRescueResponse);

  // Create a verified, active adopter account that can sign in to the client
  // app straight away. The generated password is returned once.
  rpc CreateAdopter(CreateAdopterRequest) returns (CreateAdopterResponse);

  // Deactivate an adopter made by CreateAdopter. Refuses any account whose
  // email is not a generated demo address.
  rpc DeleteAdopter(DeleteAdopterRequest) returns (DeleteAdopterResponse);

  // Add sample available pets, tagged "demo", to an existing verified rescue.
  rpc CreatePets(CreatePetsRequest) returns (CreatePetsResponse);

  // Soft-delete the pets in a rescue that carry the "demo" tag. Never touches
  // unmarked pets or the rescue itself.
  rpc DeletePets(DeletePetsRequest) returns (DeletePetsResponse);
}

message CreateRescueRequest {
  // Rescue name. Defaults to "Demo Rescue <short id>".
  optional string name = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  // Sample pets to add, 0 to 10. Defaults to 3.
  optional uint32 pet_count = 2;
}

message CreateRescueResponse {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string rescue_name = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  string owner_user_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // A generated demo-<id>@example.com address, not a real person's.
  string owner_email = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // The owner's generated password. service.ops shows it once, in the
  // execute result only.
  string owner_password = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_SPECIAL];
  repeated string pet_ids = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Where to sign in and what to do next.
  string next_steps = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message DeleteRescueRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeleteRescueResponse {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  repeated string deleted_pet_ids = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  repeated string deactivated_user_ids = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message CreateAdopterRequest {
  // Defaults to "Demo".
  optional string first_name = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message CreateAdopterResponse {
  string user_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // A generated demo-<id>@example.com address, not a real person's.
  string email = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // The generated password. service.ops shows it once, in the execute
  // result only.
  string password = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_SPECIAL];
  // Where to sign in and what to do next.
  string next_steps = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message DeleteAdopterRequest {
  string user_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeleteAdopterResponse {
  string user_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // The status the account was left in: "deactivated".
  string status = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message CreatePetsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Sample pets to add, 1 to 25. Defaults to 5.
  optional uint32 count = 2;
}

message CreatePetsResponse {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  repeated string pet_ids = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // What to do next, including the delete-pets command.
  string next_steps = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message DeletePetsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeletePetsResponse {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  repeated string deleted_pet_ids = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}
