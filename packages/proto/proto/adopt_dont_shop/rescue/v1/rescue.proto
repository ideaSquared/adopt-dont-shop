message ListRescueInvitationsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListRescueInvitationsResponse {
  // Pending (used = false) invitations for the rescue. Token omitted.
  repeated Invitation invitations = 1;
}

// --- CancelRescueInvitation (admin) -----------------------------------

message CancelRescueInvitationRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string invitation_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message CancelRescueInvitationResponse {
  bool cancelled = 1;
}

// --- Application questions --------------------------------------------

enum ApplicationQuestionScope {
  APPLICATION_QUESTION_SCOPE_UNSPECIFIED = 0;
  APPLICATION_QUESTION_SCOPE_CORE = 1;
  APPLICATION_QUESTION_SCOPE_RESCUE_SPECIFIC = 2;
}

// category / question_type are carried as the raw Postgres ENUM strings
// (e.g. 'personal_information', 'text') rather than proto enums — the DB
// type is the source of truth and the REST surface speaks those strings.
message ApplicationQuestion {
  string question_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string rescue_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_key = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  ApplicationQuestionScope scope = 4;
  string category = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_type = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_text = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string help_text = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string placeholder = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  repeated string options = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  int32 display_order = 11;
  bool is_enabled = 12;
  bool is_required = 13;
  string created_at = 14 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 15 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListApplicationQuestionsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListApplicationQuestionsResponse {
  repeated ApplicationQuestion questions = 1;
}

message CreateApplicationQuestionRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_key = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string category = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_type = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string question_text = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string help_text = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string placeholder = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  repeated string options = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  int32 display_order = 9;
  bool is_required = 10;
}

message CreateApplicationQuestionResponse {
  ApplicationQuestion question = 1;
}

message DeleteApplicationQuestionRequest {
  string question_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message DeleteApplicationQuestionResponse {
  bool deleted = 1;
}
message UpdateApplicationQuestionRequest {
  string question_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string category = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string question_type = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string question_text = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string help_text = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string placeholder = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  repeated string options = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional int32 display_order = 8;
  optional bool is_required = 9;
  optional bool is_enabled = 10;
}
message UpdateApplicationQuestionResponse {
  ApplicationQuestion question = 1;
}
message ReorderApplicationQuestionsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Question ids in the desired display order; each question's
  // display_order becomes its index in this list.
  repeated string question_ids = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}
message ReorderApplicationQuestionsResponse {
  repeated ApplicationQuestion questions = 1;
}

// --- Admin extras -----------------------------------------------------

message UpdateRescuePlanRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // 'free' | 'growth' | 'professional'. Validated by the handler.
  string plan = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optional ISO-8601 expiry. Empty/unset clears the expiry.
  optional string plan_expires_at = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message UpdateRescuePlanResponse {
  Rescue rescue = 1;
}

message GetRescueStatisticsRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

// Mirrors the SPA's RescueStatistics shape. staff_count is real
// (sourced from rescue.staff_members); the pet/application-derived
// counts default to zero (those records live in other verticals — see
// the RPC doc comment).
message RescueStatistics {
  uint32 total_pets = 1;
  uint32 available_pets = 2;
  uint32 adopted_pets = 3;
  uint32 pending_applications = 4;
  uint32 total_applications = 5;
  uint32 staff_count = 6;
  uint32 active_listings = 7;
  uint32 monthly_adoptions = 8;
  double average_time_to_adoption = 9;
}

message GetRescueStatisticsResponse {
  RescueStatistics statistics = 1;
}

// --- CountRescues -----------------------------------------------------

message CountRescuesRequest {}

// Exact platform-wide rescue counts, one field per lifecycle status plus
// the grand total. Flat scalar fields (mirrors RescueStatistics) rather
// than a map so consumers read named counts without a key lookup.
message CountRescuesResponse {
  uint32 pending = 1;
  uint32 verified = 2;
  uint32 suspended = 3;
  uint32 inactive = 4;
  uint32 rejected = 5;
  // Sum across every status (includes any not broken out above).
  uint32 total = 6;
}

// --- GetRescueNames ---------------------------------------------------

message GetRescueNamesRequest {
  repeated string rescue_ids = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message RescueName {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string name = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
}

message GetRescueNamesResponse {
  repeated RescueName names = 1;
}

message SendRescueEmailRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Either a predefined template id, OR a custom subject + body.
  optional string template_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string subject = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string body = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message SendRescueEmailResponse {
  bool queued = 1;
}
