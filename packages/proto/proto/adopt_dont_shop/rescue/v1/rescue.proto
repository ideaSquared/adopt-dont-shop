syntax = "proto3";

package adopt_dont_shop.rescue.v1;

import "proto/adopt_dont_shop/v1/options.proto";

// RescueService is the gRPC contract for the rescue vertical. It owns
// the `rescue.*` schema (Rescue, RescueSettings, StaffMember, Invitation,
// FosterPlacement, ApplicationQuestion) and exposes classical CRUD plus
// a few status transitions (verify, invite-staff, accept-invitation).
//
// Classical service (no event sourcing) — but still uses
// publish-after-commit on NATS for the cross-vertical events
// downstream services consume.
//
// Convention (matches the other extracted services): ISO-8601
// timestamps as strings, opaque base64-JSON keyset cursors, enums
// mirroring the Postgres ENUM types verbatim, JSON-stringified blobs
// for the open-ended fields (settings) so the proto doesn't have to
// enumerate every nested key.
service RescueService {
  // Create a new rescue organisation. Caller MUST have `rescues.create`
  // (typically admin or self-registration via the verify flow).
  // Publishes `rescue.created` on NATS after commit.
  rpc Create(CreateRescueRequest) returns (CreateRescueResponse);

  // Public rescue sign-up: create a PENDING rescue and attach `owner_user_id`
  // (created moments earlier by auth.RegisterRescueOwner) as its first,
  // verified staff member. No principal / permission: the gateway only
  // exposes it behind the rate-limited POST /api/v1/rescues/register.
  // Publishes `rescue.created` after commit.
  rpc RegisterRescue(RegisterRescueRequest) returns (RegisterRescueResponse);

  // Fetch a single rescue by id. NOT_FOUND when missing or
  // soft-deleted. Public-ish — adopters need to render rescue details
  // on a pet's listing page.
  rpc Get(GetRescueRequest) returns (GetRescueResponse);

  // List rescues with keyset pagination + optional status filter.
  // No rescue-scope on this — the public list returns verified rescues
  // by default; admins can filter on the other statuses.
  rpc List(ListRescuesRequest) returns (ListRescuesResponse);

  // Batch read of rescue coordinates (geocoded from the postcode) for the
  // swipe card's distance badge. Verified rescues only; rescues without
  // coordinates are omitted. `rescues.read`.
  rpc GetRescueLocations(GetRescueLocationsRequest) returns (GetRescueLocationsResponse);

  // Update mutable rescue fields. Does NOT change verification status
  // — that's Verify's job. Caller MUST have `rescues.update` scoped to
  // the rescue. Publishes `rescue.updated` on NATS after commit.
  rpc Update(UpdateRescueRequest) returns (UpdateRescueResponse);

  // Mark a rescue as verified (or transition to rejected/suspended).
  // Caller MUST have `admin.security.manage` (admin-only).
  // Publishes `rescue.verified` (or `rescue.rejected` etc.) on NATS
  // after commit.
  rpc Verify(VerifyRescueRequest) returns (VerifyRescueResponse);

  // Soft-delete a rescue (stamps deleted_at; the row is retained for
  // cross-schema referential integrity and hidden from Get/List). Caller
  // MUST have `admin.security.manage` (admin-only). Publishes
  // `rescue.deleted` on NATS after commit.
  rpc Delete(DeleteRescueRequest) returns (DeleteRescueResponse);

  // Mint a staff-invitation token + persist the row. Caller MUST have
  // `staff.create` scoped to the rescue. Publishes
  // `rescue.staffInvited` on NATS — the notifications service emails
  // the invitee.
  rpc InviteStaff(InviteStaffRequest) returns (InviteStaffResponse);

  // --- Staff -----------------------------------------------------------

  // Return the calling principal's staff-member record (their rescue
  // membership). NOT_FOUND when the user is not staff at any rescue.
  // Self-scoped — no user_id field.
  rpc GetMyStaffMembership(GetMyStaffMembershipRequest)
      returns (GetMyStaffMembershipResponse);

  // List all staff members at a rescue. Caller MUST be a verified staff
  // member of that rescue (or admin). Used by the staff "colleagues"
  // view.
  rpc ListStaffMembers(ListStaffMembersRequest) returns (ListStaffMembersResponse);

  // Directly add an existing user as a verified staff member of a
  // rescue (no invitation round-trip). Caller MUST have `staff.create`
  // scoped to the rescue. Publishes `rescue.staffMemberCreated` on NATS
  // after commit.
  rpc CreateStaffMember(CreateStaffMemberRequest)
      returns (CreateStaffMemberResponse);

  // Update a staff member's mutable fields (currently just `title`).
  // Caller MUST have `staff.update` scoped to the rescue.
  // Publishes `rescue.staffMemberUpdated` on NATS after commit.
  rpc UpdateStaffMember(UpdateStaffMemberRequest)
      returns (UpdateStaffMemberResponse);

  // Soft-delete a staff member's rescue membership. Caller MUST have
  // `staff.delete` scoped to the rescue. NOT_FOUND when the membership
  // doesn't exist or was already removed. Publishes
  // `rescue.staffMemberRemoved` on NATS after commit.
  rpc RemoveStaffMember(RemoveStaffMemberRequest)
      returns (RemoveStaffMemberResponse);

  // --- Foster placements ----------------------------------------------

  // Create a foster placement. Caller MUST have `foster.create` scoped
  // to the rescue. Publishes `rescue.fosterPlacementCreated`.
  rpc CreateFosterPlacement(CreateFosterPlacementRequest)
      returns (CreateFosterPlacementResponse);

  // List foster placements with optional filters (rescue, foster user,
  // status). Caller MUST have `foster.read` for the rescue.
  rpc ListFosterPlacements(ListFosterPlacementsRequest)
      returns (ListFosterPlacementsResponse);

  // Fetch a single foster placement by id.
  rpc GetFosterPlacement(GetFosterPlacementRequest)
      returns (GetFosterPlacementResponse);

  // End an active placement (return-to-rescue / adopted-by-foster /
  // cancelled). Idempotent on already-ended placements. Publishes
  // `rescue.fosterPlacementEnded`.
  rpc EndFosterPlacement(EndFosterPlacementRequest)
      returns (EndFosterPlacementResponse);

  // --- Invitations -----------------------------------------------------

  // Read an invitation's public details by token (for the accept page).
  // Returns the email + rescue + expiry so the SPA can render the
  // accept form. NOT_FOUND when the token is unknown, expired, or used.
  // Public — no principal required (the token IS the credential).
  rpc GetInvitationByToken(GetInvitationByTokenRequest)
      returns (GetInvitationByTokenResponse);

  // Consume a pending invitation: mark it used + attach the given user
  // as a staff member of the invited rescue. The gateway calls this
  // AFTER provisioning the auth user (the token-bearer's account), so it
  // supplies the resolved user_id. Validates the token again (unused +
  // unexpired) inside the transaction. Idempotent: re-accepting an
  // already-consumed invitation for the same user returns the existing
  // membership rather than erroring. NOT_FOUND when the token is unknown
  // or expired; FAILED_PRECONDITION when it was already used by a
  // DIFFERENT user. Public — the token IS the credential.
  rpc AcceptInvitation(AcceptInvitationRequest)
      returns (AcceptInvitationResponse);

  // --- Application questions -------------------------------------------

  // List a rescue's adoption-application questions: the shared `core`
  // baseline plus the rescue's own `rescue_specific` rows. Caller MUST
  // have `applications.read` scoped to the rescue.
  rpc ListApplicationQuestions(ListApplicationQuestionsRequest)
      returns (ListApplicationQuestionsResponse);

  // Create a rescue-specific custom question. Caller MUST have
  // `applications.update` scoped to the rescue. Publishes
  // `rescue.applicationQuestionCreated`.
  rpc CreateApplicationQuestion(CreateApplicationQuestionRequest)
      returns (CreateApplicationQuestionResponse);

  // Soft-delete a rescue-specific question. Caller MUST have
  // `applications.update` scoped to the question's rescue. Core
  // questions cannot be deleted (FAILED_PRECONDITION).
  rpc DeleteApplicationQuestion(DeleteApplicationQuestionRequest)
      returns (DeleteApplicationQuestionResponse);

  // Update a rescue-specific question's editable fields (only the
  // supplied fields are written). Caller MUST have `applications.update`
  // scoped to the question's rescue; core questions cannot be edited
  // (FAILED_PRECONDITION). Publishes `rescue.applicationQuestionUpdated`.
  rpc UpdateApplicationQuestion(UpdateApplicationQuestionRequest)
      returns (UpdateApplicationQuestionResponse);

  // Reorder a rescue's custom questions: each question's display_order is
  // rewritten to its index in `question_ids`. Caller MUST have
  // `applications.update` scoped to the rescue. Publishes
  // `rescue.applicationQuestionsReordered`.
  rpc ReorderApplicationQuestions(ReorderApplicationQuestionsRequest)
      returns (ReorderApplicationQuestionsResponse);

  // --- Admin extras ----------------------------------------------------

  // Set a rescue's subscription plan tier (free / growth / professional)
  // and optional expiry. Admin-only — caller MUST have
  // `admin.security.manage`. Publishes `rescue.planUpdated` after commit.
  rpc UpdateRescuePlan(UpdateRescuePlanRequest) returns (UpdateRescuePlanResponse);

  // Compute a rescue's headline statistics for the admin detail panel.
  // staff_count is sourced from this vertical's staff_members table; the
  // pet- and application-derived counts (which live in other verticals)
  // are returned as zero defaults so the panel renders without a heavy
  // cross-service aggregation. Caller MUST have `rescues.read`.
  rpc GetRescueStatistics(GetRescueStatisticsRequest)
      returns (GetRescueStatisticsResponse);

  // Exact rescue counts per lifecycle status for the admin dashboard.
  // A single `SELECT status, COUNT(*) ... GROUP BY status` — cheap and
  // uncapped, unlike counting List() page lengths (capped at 100). Caller
  // MUST have `rescues.read`.
  rpc CountRescues(CountRescuesRequest) returns (CountRescuesResponse);

  // Batch id -> name lookup for decorating lists (e.g. the swipe deck) with
  // rescue names in ONE call instead of one Get per rescue. Public like Get:
  // a caller without `rescues.read` (or anonymous) only resolves VERIFIED
  // rescues; unknown / soft-deleted / hidden ids are simply absent from the
  // response. At most 100 ids per call.
  rpc GetRescueNames(GetRescueNamesRequest) returns (GetRescueNamesResponse);

  // Validate + enqueue an admin email to a rescue's contact address.
  // Admin-only — caller MUST have `admin.security.manage`. Confirms the
  // rescue exists, then publishes `rescue.adminEmailRequested` for the
  // notifications worker to deliver (subscriber wiring is out of scope
  // for this RPC — it stops at the published event).
  rpc SendRescueEmail(SendRescueEmailRequest) returns (SendRescueEmailResponse);

  // List a rescue's PENDING staff invitations (used = false) for the
  // admin StaffTab. Admin-only — caller MUST have `admin.security.manage`
  // (distinct from the rescue-portal `staff.read`, which is rescue-scoped
  // and would leak across rescues). The plain-text token is NEVER
  // returned here — only at InviteStaff mint time.
  rpc ListRescueInvitations(ListRescueInvitationsRequest)
      returns (ListRescueInvitationsResponse);

  // Cancel (hard-delete) a single PENDING invitation. Admin-only — caller
  // MUST have `admin.security.manage`. NOT_FOUND when the invitation is
  // unknown, already accepted, or belongs to a different rescue. Publishes
  // `rescue.staffInvitationCancelled` after commit.
  rpc CancelRescueInvitation(CancelRescueInvitationRequest)
      returns (CancelRescueInvitationResponse);
}

// --- ENUMs — value lists mirror the Postgres types verbatim ----------

enum RescueStatus {
  RESCUE_STATUS_UNSPECIFIED = 0;
  RESCUE_STATUS_PENDING = 1;
  RESCUE_STATUS_VERIFIED = 2;
  RESCUE_STATUS_SUSPENDED = 3;
  RESCUE_STATUS_INACTIVE = 4;
  RESCUE_STATUS_REJECTED = 5;
}

enum RescueVerificationSource {
  RESCUE_VERIFICATION_SOURCE_UNSPECIFIED = 0;
  RESCUE_VERIFICATION_SOURCE_COMPANIES_HOUSE = 1;
  RESCUE_VERIFICATION_SOURCE_CHARITY_COMMISSION = 2;
  RESCUE_VERIFICATION_SOURCE_MANUAL = 3;
}

// --- Rescue — denormalised listing row -------------------------------
//
// Carries the columns the SPA + admin app render today: identity,
// address, status / verification, contact, the registration numbers.
// Settings rides as a JSON-stringified blob so the proto doesn't have
// to enumerate every nested key.
message Rescue {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string name = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  string email = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string phone = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string address = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string city = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  // Model attribute `county` maps to the legacy column `state` (matches
  // the monolith's getter/setter pair).
  optional string county = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  string postcode = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string country = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string website = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string description = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string mission = 12 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string companies_house_number = 13;
  optional string charity_registration_number = 14;
  string contact_person = 15 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_title = 16 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_email = 17 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_phone = 18 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  RescueStatus status = 19;
  optional string verified_at = 20 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string verified_by = 21 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional RescueVerificationSource verification_source = 22;
  optional string verification_failure_reason = 23 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // JSON-stringified blob (the rescue_settings 1:1 row merged in OR the
  // free-form jsonb settings on the row — depends on whether the
  // typed-settings table is loaded). Empty string == `{}`.
  string settings_json = 24;
  string created_at = 25 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 26 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Subscription plan tier — 'free' | 'growth' | 'professional'. Defaults
  // to 'free'. Drives the admin Plan tab + feature gating downstream.
  string plan = 27 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optional ISO-8601 plan expiry. Unset = no expiry.
  optional string plan_expires_at = 28 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Optimistic-concurrency version — bumped on every Update. Optional
  // (rather than a plain scalar) so existing callers that construct a
  // Rescue without it — fixtures, stub servers — keep working; only
  // fetchRescue's real row-to-proto mapping is expected to set it.
  optional uint32 version = 29;
}

// Invitation mirrors the rescue.invitations row — the pending-staff
// invitation surfaced to the inviter for revocation / resend.
message Invitation {
  string invitation_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string email = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string rescue_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string user_id = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string title = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string invited_by = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string expiration = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  bool used = 8;
  string created_at = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

// --- Create ----------------------------------------------------------

message CreateRescueRequest {
  string name = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  string email = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string phone = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string address = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string city = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string county = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  string postcode = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // Defaults to 'GB' if omitted/empty.
  optional string country = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string website = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string description = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string mission = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string companies_house_number = 12;
  optional string charity_registration_number = 13;
  string contact_person = 14 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_title = 15 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_email = 16 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_phone = 17 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message CreateRescueResponse {
  Rescue rescue = 1;
}

message RegisterRescueRequest {
  CreateRescueRequest rescue = 1;
  string owner_user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message RegisterRescueResponse {
  Rescue rescue = 1;
}

// --- Get --------------------------------------------------------------

message GetRescueRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message GetRescueResponse {
  Rescue rescue = 1;
}

message GetRescueLocationsRequest {
  repeated string rescue_ids = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message RescueLocation {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  double latitude = 2;
  double longitude = 3;
}

message GetRescueLocationsResponse {
  repeated RescueLocation locations = 1;
}

// --- List -------------------------------------------------------------

message ListRescuesRequest {
  optional string cursor = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Defaults to 20, max 100.
  uint32 limit = 2;
  // Optional status filter. UNSPECIFIED = "verified only" (the public
  // default). Admins can pass any other status to scope.
  RescueStatus status_filter = 3;
  // Free-text search on rescue name (ILIKE). Empty/unset = no filter.
  optional string name_search = 4;
  // When set, results are ordered randomly instead of by created_at DESC.
  // Powers the "featured rescues" surface.
  optional bool randomize = 5;
  // Geo filters — when all three are set we approximate "nearby" using
  // the legacy location columns. Distance math is best-effort (no PostGIS
  // required); a future revision can switch to earth_distance / GIST.
  optional double latitude = 6;
  optional double longitude = 7;
  optional double radius_km = 8;
  // Offset pagination for admin datatables. When set (>0) the handler
  // returns an OFFSET page plus a real `total` (COUNT) instead of a keyset
  // cursor, so the shared DataTable can render "Page X of Y".
  optional uint32 page = 9;
  // Admin "show every lifecycle status" scope for the rescues datatable.
  // Drops the status predicate entirely; gated on the platform-admin
  // permission in the handler.
  optional bool all_statuses = 10;
}

message ListRescuesResponse {
  repeated Rescue rescues = 1;
  optional string next_cursor = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Total row count for the current filter — present only in offset mode
  // (page set). Keyset responses omit it.
  optional uint32 total = 3;
}

// --- Update -----------------------------------------------------------

message UpdateRescueRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // All optional — only the supplied fields are written.
  optional string name = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string phone = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string address = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string city = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string county = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string postcode = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string country = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string website = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string description = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string mission = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PUBLIC];
  optional string contact_person = 12 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_title = 13 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_email = 14 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string contact_phone = 15 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // Replaces the settings JSON blob wholesale when present.
  optional string settings_json = 16;
  // Optimistic-concurrency guard — the caller's last-known version.
  // The service rejects with FAILED_PRECONDITION when the row has
  // moved beyond this version. Unset = no check (last-write-wins,
  // the pre-existing behaviour).
  optional uint32 expected_version = 17;
  // The rescue's primary email (rescue.rescues.email, unique).
  optional string email = 18 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message UpdateRescueResponse {
  Rescue rescue = 1;
}

// --- Verify -----------------------------------------------------------

message VerifyRescueRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // The target status — typically VERIFIED, but REJECTED + SUSPENDED
  // pass through here too so the admin app drives the lifecycle from
  // one RPC. Rejected by the service when the transition is illegal.
  RescueStatus to_status = 2;
  // For VERIFIED transitions: how the rescue was verified.
  optional RescueVerificationSource verification_source = 3;
  // For REJECTED: optional rejection reason persisted to the row.
  optional string failure_reason = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message VerifyRescueResponse {
  Rescue rescue = 1;
}
message DeleteRescueRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string reason = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}
message DeleteRescueResponse {
  Rescue rescue = 1;
}

// --- InviteStaff ------------------------------------------------------

message InviteStaffRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string email = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  optional string title = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  // Optional TTL override; defaults to 7 days when omitted.
  optional uint32 expires_in_seconds = 4;
}

message InviteStaffResponse {
  Invitation invitation = 1;
  // Plain-text invitation token returned ONCE at creation time so the
  // caller can dispatch the email. NOT readable through Get/List
  // afterwards.
  string token = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_SPECIAL];
}

// --- StaffMember ------------------------------------------------------

// StaffMember mirrors the rescue.staff_members row. The user's name /
// email aren't stored here (they live in auth.users) — the gateway
// joins them in when the SPA needs the colleague list with names, or
// the SPA fetches them separately. This message carries only the
// rescue-owned columns.
message StaffMember {
  string staff_member_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string rescue_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string title = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  bool is_verified = 5;
  optional string verified_by = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string verified_at = 7 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string added_by = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string added_at = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string created_at = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 11 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message GetMyStaffMembershipRequest {}

message GetMyStaffMembershipResponse {
  StaffMember staff_member = 1;
}

message ListStaffMembersRequest {
  // Rescue to list staff for. When empty, the service resolves the
  // caller's own rescue from their staff membership (the "colleagues"
  // case).
  optional string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message ListStaffMembersResponse {
  repeated StaffMember staff_members = 1;
}

// --- CreateStaffMember --------------------------------------------------

message CreateStaffMemberRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Existing auth user to add as staff. Caller is responsible for
  // ensuring the user exists; the service does not provision accounts.
  string user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string title = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message CreateStaffMemberResponse {
  StaffMember staff_member = 1;
}

// --- UpdateStaffMember --------------------------------------------------

message UpdateStaffMemberRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // Only the supplied fields are written.
  optional string title = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message UpdateStaffMemberResponse {
  StaffMember staff_member = 1;
}

// --- RemoveStaffMember --------------------------------------------------

message RemoveStaffMemberRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message RemoveStaffMemberResponse {
  bool removed = 1;
}

// --- FosterPlacement --------------------------------------------------

enum FosterPlacementStatus {
  FOSTER_PLACEMENT_STATUS_UNSPECIFIED = 0;
  FOSTER_PLACEMENT_STATUS_ACTIVE = 1;
  FOSTER_PLACEMENT_STATUS_COMPLETED = 2;
  FOSTER_PLACEMENT_STATUS_CANCELLED = 3;
}

message FosterPlacement {
  string placement_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string rescue_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string pet_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string foster_user_id = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string start_date = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string end_date = 6 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  FosterPlacementStatus status = 7;
  optional string notes = 8 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
  string created_at = 9 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string updated_at = 10 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message CreateFosterPlacementRequest {
  string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string pet_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string foster_user_id = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  string start_date = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 5 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message CreateFosterPlacementResponse {
  FosterPlacement placement = 1;
}

message ListFosterPlacementsRequest {
  optional string rescue_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string foster_user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  // UNSPECIFIED = no status filter.
  FosterPlacementStatus status_filter = 3;
}

message ListFosterPlacementsResponse {
  repeated FosterPlacement placements = 1;
}

message GetFosterPlacementRequest {
  string placement_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message GetFosterPlacementResponse {
  FosterPlacement placement = 1;
}

// Outcome maps onto the terminal status: return_to_rescue / cancelled
// → CANCELLED-or-COMPLETED per the monolith's semantics; adopted_by_
// foster → COMPLETED.
enum FosterEndOutcome {
  FOSTER_END_OUTCOME_UNSPECIFIED = 0;
  FOSTER_END_OUTCOME_RETURN_TO_RESCUE = 1;
  FOSTER_END_OUTCOME_ADOPTED_BY_FOSTER = 2;
  FOSTER_END_OUTCOME_CANCELLED = 3;
}

message EndFosterPlacementRequest {
  string placement_id = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  FosterEndOutcome outcome = 2;
  optional string end_date = 3 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
  optional string notes = 4 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_PII];
}

message EndFosterPlacementResponse {
  FosterPlacement placement = 1;
}

// --- GetInvitationByToken --------------------------------------------

message GetInvitationByTokenRequest {
  string token = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_SPECIAL];
}

message GetInvitationByTokenResponse {
  Invitation invitation = 1;
}

// --- AcceptInvitation -------------------------------------------------

message AcceptInvitationRequest {
  // The invitation token from the email link (the credential).
  string token = 1 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_SPECIAL];
  // The auth user that the gateway provisioned (or found) for the
  // invitee's email. Becomes the staff member's user_id.
  string user_id = 2 [(adopt_dont_shop.v1.sensitivity) = SENSITIVITY_INTERNAL];
}

message AcceptInvitationResponse {
  // The staff membership the invitee now holds at the rescue.
  StaffMember staff_member = 1;
}

