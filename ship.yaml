# How ADS deploys with ideaSquared/shipper (`ship status ads`, `ship deploy ads staging`,
# `ship deploy ads production`, `ship rollback ads <env>`). The deploy itself is this repo's own
# .github/workflows/deploy.yml; .github/workflows/ship.yml runs shipper's gate before it and
# shipper's Discord report after it.
product: ads
# ideaSquared bot project: deploy messages go to its ads-github channel.
discord: ads
# Must have passed on the commit (shipper's gate, and the `ship status` / `ship diff` / `ship deploy`
# warnings before a deploy starts). This is the same list as the required status checks in
# .github/rulesets/main-required-checks.json (COMMON-18); keep the two identical. Each one reports on
# every push to main, passing when it has nothing to verify. deploy.yml separately waits for the
# whole CI run and the `Production Image Smoke (boot)` job before it builds.
checks:
  - CI Required
  - Verify every lib.* package has tests
  - Schema Equivalence (migrate vs sync)
  - Production Image Smoke
dispatch:
  workflow: ship.yml
  environmentInput: environment
  # rollback.yml takes `environment` and `sha` and redeploys that commit's signed images.
  rollbackWorkflow: rollback.yml
environments:
  staging: {}
  # There is no production environment yet. When it exists, add it back as:
  #   production:
  #     requires: [staging]
  # and restore `production` in the environment choices of ship.yml, deploy.yml and rollback.yml.
components:
  stack:
    type: external
    workflow: .github/workflows/deploy.yml
