# Canonical list of "source paths that matter" for workflow `paths:` filters.
# Single source of truth (ADS-767). When you add a new top-level workspace
# (e.g. lib.foo, app.bar) add it here ONCE and the CI guard
# `scripts/check-workflow-paths.mjs` will fail any workflow whose `paths:`
# filter has drifted.
#
# Two workflows consume this list with the modifier described in the
# `consumers` block: any workflow whose `paths:` block diverges from the
# resolved list will fail the guard. Workflows that deliberately do not
# consume it are documented at the end of the `consumers` block.

paths:
  - 'apps/**'
  - 'packages/**'
  - 'services/**'
  - 'package.json'
  - 'pnpm-lock.yaml'

consumers:
  # quality.yml + security.yml use the canonical list verbatim on both
  # push and pull_request triggers.
  - workflow: .github/workflows/quality.yml
    triggers: [push, pull_request]
    extra: []
  - workflow: .github/workflows/security.yml
    triggers: [push, pull_request]
    extra: []

  # schema-equivalence.yml (ADS-1065) intentionally does NOT consume the
  # canonical list, and it no longer carries a trigger-level `paths:` filter at
  # all: a required check filtered out at the trigger level never reports and
  # permanently blocks non-migration PRs. It now triggers on every push/PR and
  # scopes the expensive migrate job INTERNALLY, via a `dorny/paths-filter`
  # `changes` job over the migration/schema-owning paths (services/*/src/
  # migrations/**, services/*/src/db/**, the packages the migrate job builds —
  # packages/db/**, packages/observability/**, packages/events/** —
  # pnpm-lock.yaml, and the workflow file); the always-on gate job reports the
  # required check. It is therefore not a canonical consumer — the guard's
  # drift check does not apply, only the literal-path-exists check (which also
  # scans that in-job `filters:` block). Recorded here so the single source of
  # truth documents the deliberate divergence.
  #
  # docker.yml (ADS-1400) likewise stopped being a consumer. It was one
  # (ADS-1314: the canonical list plus the Docker plumbing — `**/Dockerfile*`,
  # `docker-compose*.yml`, `.dockerignore` — on both push and pull_request),
  # but its "Production Image Smoke" job is a required check, and a required
  # check filtered out at the trigger level never reports, so every PR that
  # touched none of those paths (docs, scripts, .github, e2e, …) sat at
  # "Expected — waiting for status". It now triggers on every push/PR and a
  # `dorny/paths-filter` `changes` job applies those same paths (plus the
  # workflow file itself) internally; the always-on `prod-image-smoke-gate`
  # job reports the required check. Not a canonical consumer — only the
  # literal-path-exists check applies to that in-job `filters:` block.
