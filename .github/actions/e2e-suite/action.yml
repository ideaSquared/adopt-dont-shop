name: 'E2E Suite (Playwright)'
description: >-
  Full body of ci.yml's test-e2e job (ADS-953): builds the shared dev image,
  boots the isolated ads-e2e stack (docker-compose.e2e.yml, via
  scripts/e2e-isolated.mjs), runs the Playwright suite against it, and tears it
  down. Extracted into a composite action purely to shrink ci.yml; the job
  itself (name, needs, if-gating, env, timeout) stays in ci.yml so its
  status-check identity is unchanged. See that job for the opt-in-on-PRs
  rationale (`run-e2e` label / push to main / workflow_dispatch).
inputs:
  mode:
    description: >-
      Which Playwright subset to run: "full" (default — the complete suite, for
      the opt-in test-e2e job) or "smoke" (the @smoke-tagged headline journeys:
      auth, adoption application, chat, gateway login — for the required
      test-e2e-smoke PR job, ADS-1242 / ADS-1321).
    required: false
    default: 'full'
  shard-index:
    description: >-
      With shard-total, run only this shard of the full suite (Playwright
      `--shard=<index>/<total>`), report it as a blob report for ci.yml's
      test-e2e job to merge, and suffix the artifact names with the index.
      Empty (default) runs the whole selection unsharded.
    required: false
    default: ''
  shard-total:
    description: Number of shards the full suite is split into (see shard-index).
    required: false
    default: ''
runs:
  using: 'composite'
  steps:

    - uses: ./.github/actions/setup-workspace

    # ADS-792: expose ACTIONS_RUNTIME_TOKEN + cache-service URLs to plain
    # `run:` steps so the raw `docker buildx bake` call below can use
    # cache-from/cache-to type=gha. JS actions (docker/build-push-action)
    # receive these implicitly; shell steps do not.
    - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

    # ADS-792: type=gha cache import/export requires a docker-container
    # builder — the daemon's integrated BuildKit does not support it.
    # Known tradeoff (this previously kept buildx out of this job): the
    # container builder stores layers twice at peak — BuildKit cache plus
    # the tarball re-import into the daemon ("sending tarball"). Two
    # things keep that inside the runner's disk budget now:
    #   - warm GHA cache hits skip re-executing (and re-storing
    #     intermediates for) the expensive npm-ci/turbo layers;
    #   - the build step prunes the BuildKit cache immediately after
    #     --load, before the stack boots.
    # ENOSPC under a fully cold cache is the residual risk — see the
    # build step below. max-parallelism=4 replaces the old
    # COMPOSE_PARALLEL_LIMIT=4: 12 concurrent `pnpm install` runs against the
    # registry was the ECONNRESET source ADS-792 describes.
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        driver-opts: |
          image=moby/buildkit:v0.23.0
          network=host
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 4

    - name: Resolve Playwright version
      id: pw
      shell: bash
      run: |
        version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # ADS-901: this is a single-lockfile workspace (e2e/ has no lockfile
        # of its own — pnpm-workspace.yaml includes it), so the root
        # pnpm-lock.yaml hash is what actually changes when @playwright/test
        # bumps. Without it, a patch bump that doesn't change `steps.pw`'s
        # resolved version string could keep a stale cache and mismatch the
        # installed browsers against the newer test runner.
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      shell: bash
      # The browser comes from the cache or Playwright's CDN; its system
      # packages come from the Ubuntu mirrors via apt. When the runner can't
      # reach those mirrors, `--with-deps` failed the whole job before any test
      # ran, though the runner image already carries what Chromium needs (the
      # missing packages were extra fonts). Install the browser strictly and
      # the system packages best-effort: if something essential really is
      # missing, the browser fails to launch and the tests say so.
      run: |
        pnpm --filter @adopt-dont-shop/e2e exec playwright install chromium
        pnpm --filter @adopt-dont-shop/e2e exec playwright install-deps chromium \
          || echo "::warning title=Playwright system packages::apt install failed (mirror unreachable?); continuing with the runner image's packages"

    - name: Build the shared dev image
      # The isolated stack (docker-compose.e2e.yml on top of the dev compose
      # files) runs every app and service from ONE image, the same
      # adopt-dont-shop-dev:latest the dev stack uses: a single workspace
      # install baked once, with the checkout bind-mounted over /app. That
      # replaces the previous 14 per-service images (and their ~25 GB of disk
      # and per-target cache scopes) with one build and one gha cache scope.
      #
      # `bake` interpolates the compose files, so the `${VAR:?}` guards need
      # values; they are placeholders here because nothing secret is baked into
      # the image. scripts/e2e-isolated.mjs generates the real, per-run secrets.
      # Only non-PR runs write the layer cache (a PR run reads main's), so PRs do
      # not evict main's warm layers from the repo-wide 10 GB cache budget.
      shell: bash
      env:
        NATS_AUTH_TOKEN: build-only
        JWT_SECRET: build-only
        JWT_REFRESH_SECRET: build-only
        ENCRYPTION_KEY: build-only
        GF_SECURITY_ADMIN_PASSWORD: build-only
      run: |
        set -euo pipefail
        set_args=(--set "app-admin.cache-from=type=gha,scope=e2e-dev-image")
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          set_args+=(--set "app-admin.cache-to=type=gha,mode=min,scope=e2e-dev-image,ignore-error=true")
        fi
        # --load puts the image in the daemon store under the `image:` tag the
        # dev override sets, where `compose up --no-build` expects it.
        docker buildx bake -f docker-compose.yml -f docker-compose.dev.yml --load "${set_args[@]}" app-admin
        docker buildx prune -af > /dev/null
        docker image ls adopt-dont-shop-dev
        df -h /

    - name: Run Playwright against the isolated stack
      # scripts/e2e-isolated.mjs does the whole lifecycle: fresh secrets, boot
      # (the lib.* packages are built on the host first), wait for health, persona
      # seed from the host, Playwright, and `down -v` of the ads-e2e project.
      # On failure it prints container status plus recent logs and writes the
      # full logs to docker-compose.log for the artifact below.
      #
      # Two callers (ADS-1242):
      #   - the opt-in test-e2e-shard jobs (main push / `run-e2e` label /
      #     dispatch) want complete integration coverage -> mode: full, which
      #     also starts the production-limits gateway for the limiter spec.
      #     Each runs one `--shard`; the blob reporter replaces the config's
      #     reporters (list and github kept) so test-e2e can merge the shards.
      #   - the required test-e2e-smoke PR job runs only the @smoke-tagged
      #     headline journeys for a fast pre-merge signal -> mode: smoke.
      #
      # Retries and workers are configured in e2e/playwright.config.ts
      # (retries: CI ? 1 : 0, workers: CI ? 2 : undefined).
      shell: bash
      env:
        SHARD_INDEX: ${{ inputs.shard-index }}
        SHARD_TOTAL: ${{ inputs.shard-total }}
      run: |
        if [ "${{ inputs.mode }}" = "smoke" ]; then
          echo "${{ github.event_name }} on ${{ github.ref }} - running @smoke subset"
          node scripts/e2e-isolated.mjs
        elif [ -n "$SHARD_INDEX" ]; then
          echo "${{ github.event_name }} on ${{ github.ref }} - running full suite, shard ${SHARD_INDEX}/${SHARD_TOTAL}"
          node scripts/e2e-isolated.mjs --full "--shard=${SHARD_INDEX}/${SHARD_TOTAL}" --reporter=list,github,blob
        else
          echo "${{ github.event_name }} on ${{ github.ref }} - running full suite"
          node scripts/e2e-isolated.mjs --full
        fi

    # ADS-386: Surface flaky-retry signal so engineers can see which tests
    # needed retries without having to open the full HTML report.
    # This step never blocks CI — it is informational only.
    - name: Report E2E retry counts
      if: always()
      shell: bash
      run: |
        report_dir="e2e/test-results"
        if [ ! -d "$report_dir" ]; then
          echo "No test-results directory found — Playwright may not have run."
          exit 0
        fi
        retried=$(find "$report_dir" -name '*.json' -exec grep -l '"retry":[^0]' {} \; 2>/dev/null | wc -l)
        if [ "$retried" -gt 0 ]; then
          echo "::warning::$retried test result file(s) contain retries — check the Playwright report artifact for details."
        else
          echo "No retried tests detected in this run."
        fi

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-playwright-report${{ inputs.shard-index && format('-shard-{0}', inputs.shard-index) || '' }}
        path: |
          e2e/playwright-report/
          e2e/test-results/
          docker-compose.log
        retention-days: 7
        if-no-files-found: ignore

    # Input for the merged HTML report ci.yml's test-e2e job builds.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always() && inputs.shard-index != ''
      with:
        name: e2e-blob-report-${{ inputs.shard-index }}
        path: e2e/blob-report/
        retention-days: 1
        if-no-files-found: ignore

    - name: Tear down stack
      # The script tears down after itself; this covers a cancelled or timed
      # out job. Scoped to the ads-e2e project, idempotent.
      if: always()
      shell: bash
      run: node scripts/e2e-isolated.mjs --down
