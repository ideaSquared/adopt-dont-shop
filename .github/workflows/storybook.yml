name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'packages/lib.components/**'
  pull_request:
    paths:
      - 'packages/lib.components/**'
  schedule:
    # Nightly stories-coverage report (ADS-956). Only the stories-coverage
    # job below runs on this trigger — build-storybook / deploy-storybook
    # stay scoped to push/pull_request/workflow_dispatch so a schedule tick
    # doesn't rebuild or redeploy the Storybook site.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stories-coverage:
    name: Stories coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup workspace (Node + pnpm)
        uses: ./.github/actions/setup-workspace
      - name: Run stories coverage report
        run: node scripts/check-storybook-coverage.mjs

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup workspace (Node + pnpm)
        uses: ./.github/actions/setup-workspace
      # ADS-909: cache the built output, keyed on every source file that can
      # affect it — component source, stories, theme (src/**), Storybook and
      # Vite config, the package manifest, tsconfig and the lockfile. The
      # workflow's path filter (packages/lib.components/**) is broader than
      # this key, so a change outside these inputs (e.g. the package-level
      # README) still triggers the job but restores on a hit.
      #
      # The key MUST be source-only. A broad `packages/lib.components/**` glob
      # also hashes node_modules, which is present here (after setup-workspace
      # installs it) but absent in the deploy-storybook job below (which has no
      # setup-workspace). The two jobs would then compute different keys, the
      # deploy restore would miss, and `cp -r storybook-static` would fail with
      # "No such file or directory". This mirrors the source-only lib-dist key
      # shared across jobs in ci.yml — keep the two keys byte-identical.
      - name: Restore Storybook build cache
        id: cache-storybook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: packages/lib.components/storybook-static
          key: storybook-${{ runner.os }}-${{ hashFiles('packages/lib.components/src/**', 'packages/lib.components/.storybook/**', 'packages/lib.components/package.json', 'packages/lib.components/tsconfig*.json', 'packages/lib.components/vite*.config.ts', 'pnpm-lock.yaml') }}
      - run: pnpm build-storybook
        if: steps.cache-storybook.outputs.cache-hit != 'true'
        working-directory: packages/lib.components

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-storybook
    if: github.ref == 'refs/heads/main'
    # ADS-950: serialise Storybook deploys so they don't race with each other
    # (concurrent pushes to the same gh-pages root would produce conflicts).
    # PR previews (preview.yml) were removed in ADS-1015/1016; the pr-previews/
    # preservation below is retained only to avoid clobbering any leftover
    # preview directories still on gh-pages until they're cleaned up separately.
    concurrency:
      group: gh-pages-storybook
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Restore the storybook-static directory built (or cache-hit) above.
      # Key MUST match build-storybook's exactly (source-only — see the note
      # there) so this cross-job restore hits.
      - name: Restore Storybook build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: packages/lib.components/storybook-static
          key: storybook-${{ runner.os }}-${{ hashFiles('packages/lib.components/src/**', 'packages/lib.components/.storybook/**', 'packages/lib.components/package.json', 'packages/lib.components/tsconfig*.json', 'packages/lib.components/vite*.config.ts', 'pnpm-lock.yaml') }}

      - name: Push Storybook to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          STORYBOOK="packages/lib.components/storybook-static"

          # Stash the build before switching branches.
          cp -r "$STORYBOOK" /tmp/storybook-build

          # Checkout gh-pages (create an orphan if it doesn't exist yet).
          git fetch origin gh-pages 2>/dev/null \
            && git checkout gh-pages \
            || { git checkout --orphan gh-pages; git rm -rf . 2>/dev/null || true; }

          # Preserve any leftover pr-previews/ directory (PR previews were
          # removed in ADS-1015/1016; this guards stale dirs pending cleanup).
          if [ -d pr-previews ]; then
            cp -r pr-previews /tmp/pr-previews-backup
          fi

          # Clear the root (preserving .git and pr-previews) then copy Storybook.
          find . -maxdepth 1 ! -name '.git' ! -name 'pr-previews' ! -name '.' \
            -exec rm -rf {} + 2>/dev/null || true
          cp -r /tmp/storybook-build/. .

          # Restore pr-previews/.
          if [ -d /tmp/pr-previews-backup ]; then
            cp -r /tmp/pr-previews-backup/. pr-previews
          fi

          # .nojekyll disables Jekyll so _-prefixed Storybook asset dirs work.
          touch .nojekyll
          git add -A
          git diff --cached --quiet && echo "Nothing changed — skipping push." && exit 0

          git commit -m "deploy: storybook"

          # Retry push for the (rare) case a PR preview push just landed.
          for i in 1 2 3 4 5; do
            git push origin gh-pages && break || {
              [ "$i" -lt 5 ] || { echo "Push failed after 5 attempts"; exit 1; }
              echo "Push attempt ${i} failed — rebasing and retrying in $((i * 2))s..."
              git pull --rebase origin gh-pages 2>/dev/null || true
              sleep $((i * 2))
            }
          done
