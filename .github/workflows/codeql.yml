# GitHub CodeQL static analysis for JavaScript / TypeScript.
# Trivy in `docker.yml` covers container images; this covers source code.
# Runs on every push to main, every PR, and weekly (catches new queries
# released in the GitHub-managed query packs). [ADS-498]
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC. Aligns with the Dependabot weekly schedule so
    # security review happens in the same window.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: javascript-typescript
          # security-extended adds queries beyond the default set; this is
          # the recommended config for production code.
          queries: security-extended
          # Scope: production source only. Excludes CLI scripts, test files,
          # node_modules, dist, e2e — see .github/codeql/codeql-config.yml.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: '/language:javascript-typescript'
