name: Lib Test Guard

# Fail when any lib.* package has zero test files. This is the safety net
# behind ADS-186 / ADS-328 — `--passWithNoTests` was previously hiding whole
# packages with no behaviour tests. The script lives at scripts/check-lib-tests.mjs
# and maintains an explicit allowlist for packages that are still being
# back-filled.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lib-tests:
    name: Verify every lib.* package has tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ADS-1117: this job's status ("Verify every lib.* package has tests") is
      # a required check, so it must always report — a trigger-level `paths:`
      # filter would leave it "Expected — waiting for status" forever on non-lib
      # PRs (the trap schema-equivalence.yml documents). Instead the job always
      # runs but gates its work on an in-job dorny/paths-filter: a doc-only or
      # non-lib.* PR reports success in seconds without installing Node or
      # running the guard. push / workflow_dispatch still run it unconditionally.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            libs:
              - 'packages/lib.*/**'
              - 'scripts/check-lib-tests.mjs'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.filter.outputs.libs == 'true' || github.event_name != 'pull_request'
        with:
          node-version-file: '.nvmrc'

      - name: Run lib-tests guard
        if: steps.filter.outputs.libs == 'true' || github.event_name != 'pull_request'
        run: node scripts/check-lib-tests.mjs
