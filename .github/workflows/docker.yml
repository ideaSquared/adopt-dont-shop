name: Docker

# ADS-1314 (P1-8): production images used to be built and Trivy-scanned but
# never booted, and this workflow was not a required check — the exact
# artifact `deploy.yml` ships had never been health-checked. Two changes:
#
# - `prod-image-smoke` (below) boots the `production` target for the gateway,
#   service-auth, service-notifications and app-client against real
#   Postgres/Redis/NATS and asserts /health/ready + a real gateway route
#   respond, so a crash-looping or misconfigured image is caught before main.
# - This workflow now runs on every PR touching source (apps/, packages/,
#   services/), not only Dockerfile-changing PRs — a source change can still
#   break the image (e.g. a config-validation regression the dev-target E2E
#   stack doesn't exercise the same way) — and `prod-image-smoke`'s status
#   check is a required check (.github/rulesets/main-required-checks.json).
on:
  push:
    branches: [main, develop]
    # Source-path block below mirrors .github/workflow-source-paths.yml plus
    # the Docker-specific `extra:` entries (ADS-767). Drift fails
    # scripts/check-workflow-paths.mjs.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
  pull_request:
    branches: [main, develop]
    # ADS-1314: was narrowed to Dockerfile-changing changes only ("source-only
    # PRs are covered by ci.yml + E2E") — but ci.yml's E2E only boots
    # *development*-target images, so a source change that only breaks the
    # *production* target (e.g. a config-validation path exercised only under
    # NODE_ENV=production) never got a pre-deploy signal on a source-only PR.
    # Now identical to the push path list.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # BUILD FRONTEND APPS — dev + production images for each app
  # ============================================================================
  build-apps:
    name: Build ${{ matrix.app }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, rescue]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Build development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.app
          target: development
          build-args: |
            APP_NAME=${{ matrix.app }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:${{ matrix.app }}-dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Push-only: the prod stage re-runs `tsc && vite build` inside Docker,
      # which ci.yml's test-frontend matrix already runs natively. Keep it
      # on main pushes as a final pre-deploy gate.
      - name: Build production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.app
          target: production
          build-args: |
            APP_NAME=${{ matrix.app }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:${{ matrix.app }}-prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ============================================================================
  # BUILD SERVICES — dev image on all triggers, prod image + Trivy scan on
  # all triggers (ADS-833: scan PRs so CVEs are caught before merge, not after)
  #
  # Replaces the CVE-scan coverage lost when the service.backend monolith
  # was deleted in #995 (the old `build-backend` job ran a single Trivy
  # scan against that one image). Each of the 11 microservice images is
  # now built from the shared Dockerfile.service and scanned independently
  # so a CVE in one service surfaces in the Security tab without being
  # masked by another image's findings (fail-fast: false).
  # ============================================================================
  build-services:
    name: Build ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - notifications
          - pets
          - rescue
          - applications
          - chat
          - moderation
          - matching
          - audit
          - cms

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Log in to GHCR (for Trivy DB pulls)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: development
          build-args: |
            SERVICE=@adopt-dont-shop/service.${{ matrix.service }}
            SERVICE_DIR=services/${{ matrix.service }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:service-${{ matrix.service }}-dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Build the prod image on all triggers so Trivy can scan it (ADS-833).
      # On PRs this workflow is already narrowed to Dockerfile-changing changes,
      # so the extra build cost is bounded to the cases where scanning matters.
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: production
          load: true
          build-args: |
            SERVICE=@adopt-dont-shop/service.${{ matrix.service }}
            SERVICE_DIR=services/${{ matrix.service }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:service-${{ matrix.service }}-prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Export the just-built image to a tar so Trivy can scan it via --input
      # instead of pulling from the daemon, which is what lets the scan step
      # below skip mounting /var/run/docker.sock (ADS-1299 — that mount handed
      # a container root-equivalent control of the runner's Docker daemon).
      - name: Save production image for scanning
        run: |
          docker save paragonjenko/adoptdontshop:service-${{ matrix.service }}-prod-${{ github.sha }} \
            -o trivy-image-${{ matrix.service }}.tar

      # Scan once to JSON with --ignore-unfixed (gate only on CVEs that have an
      # upstream patch — un-actionable ones shouldn't block PRs). `trivy convert`
      # then renders that report to the job log (table) and to SARIF (Security
      # tab) without re-scanning, and the final step fails the job if the report
      # contains any CRITICAL/HIGH. (--ignore-unfixed is a scan flag; `convert`
      # rejects it, so it must live on the `image` command.)
      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2 \
            -e TRIVY_JAVA_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-java-db:1 \
            aquasec/trivy:0.63.0 image \
              --input trivy-image-${{ matrix.service }}.tar \
              --format json \
              --output trivy-results-${{ matrix.service }}.json \
              --severity CRITICAL,HIGH \
              --ignore-unfixed

      - name: Render Trivy results (table to log + SARIF)
        if: always() && hashFiles(format('trivy-results-{0}.json', matrix.service)) != ''
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0 convert --format table \
              trivy-results-${{ matrix.service }}.json
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0 convert --format sarif \
              --output trivy-results-${{ matrix.service }}.sarif \
              trivy-results-${{ matrix.service }}.json

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-service-${{ matrix.service }}'

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0 convert --exit-code 1 \
              --severity CRITICAL,HIGH \
              trivy-results-${{ matrix.service }}.json

  # ============================================================================
  # BUILD + PUBLISH SHARED DEV IMAGE (Dockerfile.dev)
  #
  # The local dev stack (docker-compose.dev.yml, driven by `pnpm docker:dev`)
  # uses one shared image that bakes a full workspace install. Publishing it to
  # GHCR means scripts/docker-dev.mjs can PULL it instead of building locally,
  # so most developers never run a build at all (the original network-flakiness
  # source). Built on every trigger to catch breakage; pushed only on main/
  # develop pushes (PRs can't push to the shared :latest tag).
  # ============================================================================
  build-dev-image:
    name: Build + Publish Dev Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR) dev image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.dev
          target: development
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ideasquared/adopt-dont-shop/dev:${{ github.sha }}
            ghcr.io/ideasquared/adopt-dont-shop/dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ============================================================================
  # PROD IMAGE SMOKE — ADS-1314 (P1-8): production images were built and
  # Trivy-scanned above but never booted, and this workflow was not a
  # required check — the exact artifact `deploy.yml` ships had never been
  # health-checked. This job boots the `production` target for the gateway,
  # two representative domain services (auth; notifications — the ADS-1301
  # P0 finding, config validation throwing under NODE_ENV=production) and one
  # frontend app against real Postgres/Redis/NATS/ClamAV containers, and
  # asserts `/health/ready` on each plus a real gateway route
  # (`GET /api/v1/legal/terms` — the second ADS-1301 P0, legal docs missing
  # from the image) before merge. `push: false` + `load: true`: images never
  # leave the runner — this is a smoke test, not a publish (release.yml /
  # deploy.yml own that).
  #
  # Rebuilds the same four images the build-apps/build-services matrix jobs
  # above already build — their outputs aren't otherwise available to this
  # job (cross-job image transfer would need a docker save/load artifact
  # round-trip for four images with no real benefit here) — reusing the
  # identical docker/build-push-action invocation shape. BuildKit's shared
  # GHA cache (same `cache-from`/`cache-to: type=gha` key space as the matrix
  # jobs above) makes the rebuild a near-total cache hit in the common case.
  #
  # EXPECTED RED until ADS-1301's batch-A fixes land (see the PR description):
  # the legal-terms assertion fails today because the production image does
  # not carry docs/legal/*.md, and the notifications /health/ready assertion
  # may also fail if batch A's actual fix shape differs from this job's
  # LEGAL_DOCS_DIR / EMAIL_PROVIDER / PUSH_PROVIDER guesses (see
  # docker-compose.ci-smoke.yml). That is this job doing its job, not a bug
  # in it — the two P0s it exists to catch were previously undetectable by
  # any CI job.
  # ============================================================================
  prod-image-smoke:
    name: Production Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Build service-gateway production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: production
          load: true
          build-args: |
            SERVICE=@adopt-dont-shop/service.gateway
            SERVICE_DIR=services/gateway
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: ghcr.io/ideasquared/adopt-dont-shop/service-gateway:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build service-auth production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: production
          load: true
          build-args: |
            SERVICE=@adopt-dont-shop/service.auth
            SERVICE_DIR=services/auth
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: ghcr.io/ideasquared/adopt-dont-shop/service-auth:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build service-notifications production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: production
          load: true
          build-args: |
            SERVICE=@adopt-dont-shop/service.notifications
            SERVICE_DIR=services/notifications
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: ghcr.io/ideasquared/adopt-dont-shop/service-notifications:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build app-client production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.app
          target: production
          load: true
          build-args: |
            APP_NAME=client
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: ghcr.io/ideasquared/adopt-dont-shop/app-client:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Throwaway, CI-only secrets — never used outside this job's ephemeral
      # runner. See docker-compose.ci-smoke.yml's header comment for what
      # each var/secret is for.
      - name: Generate throwaway secrets and env
        run: |
          mkdir -p secrets
          openssl rand -hex 16 > secrets/db_password
          openssl rand -hex 16 > secrets/redis_password
          openssl rand -hex 32 > secrets/jwt_secret
          openssl rand -hex 32 > secrets/jwt_refresh_secret
          openssl rand -hex 32 > secrets/encryption_key
          openssl rand -hex 32 > secrets/upload_signing_secret
          openssl rand -hex 32 > secrets/principal_signing_key
          openssl rand -hex 32 > secrets/nats_auth_token
          printf 'postgresql://ci_smoke:%s@database:5432/ci_smoke' "$(cat secrets/db_password)" > secrets/database_url
          printf 'redis://:%s@redis:6379' "$(cat secrets/redis_password)" > secrets/redis_url
          # ADS-1302: docker-compose.prod.yml mounts resend_api_key and
          # fcm_service_account_json into service-notifications, so the files
          # must exist for `compose up` to resolve the secrets. Throwaway values:
          # docker-compose.ci-smoke.yml pins EMAIL_PROVIDER=ethereal, and the FCM
          # JSON only has to be the right shape (no push is ever sent here).
          openssl rand -hex 16 > secrets/resend_api_key
          printf '%s' '{"project_id":"ci-smoke","client_email":"ci-smoke@example.com","private_key":"-----BEGIN PRIVATE KEY-----\nci-smoke\n-----END PRIVATE KEY-----\n"}' > secrets/fcm_service_account_json

          cat > .env <<EOF
          POSTGRES_USER=ci_smoke
          POSTGRES_DB=ci_smoke
          CORS_ORIGIN=http://localhost:8080
          DEPLOY_SHA=ci-smoke-unused
          # ADS-1302: required (:?) by docker-compose.prod.yml's service-notifications
          # block; interpolation runs before the ci-smoke override is merged.
          DEFAULT_FROM_EMAIL=ci-smoke@example.com
          FCM_PROJECT_ID=ci-smoke
          SERVICE_GATEWAY_TAG=ci-smoke
          SERVICE_AUTH_TAG=ci-smoke
          SERVICE_NOTIFICATIONS_TAG=ci-smoke
          APP_CLIENT_TAG=ci-smoke
          EOF

      - name: Start the smoke stack
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci-smoke.yml \
            up -d database redis nats clamav \
            service-gateway service-auth service-notifications app-client

      - name: Wait for /health/ready on each service
        run: |
          check() {
            name=$1
            url=$2
            for i in $(seq 1 36); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$name is ready ($url)"
                return 0
              fi
              sleep 5
            done
            echo "::error::$name never became ready at $url within the start_period"
            return 1
          }
          check service-gateway http://localhost:4000/health/ready
          check service-auth http://localhost:5002/health/ready
          check service-notifications http://localhost:5001/health/ready
          check app-client http://localhost:8080/health

      - name: Assert GET /api/v1/legal/terms returns 200
        run: |
          status=$(curl -s -o /tmp/legal-terms.json -w '%{http_code}' http://localhost:4000/api/v1/legal/terms)
          cat /tmp/legal-terms.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::GET /api/v1/legal/terms returned $status, expected 200 — see ADS-1301 P0 (legal docs missing from the production image)."
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci-smoke.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci-smoke.yml down -v
