name: Docker

# ADS-1314 (P1-8): production images used to be built and Trivy-scanned but
# never booted, and this workflow was not a required check — the exact
# artifact `deploy.yml` ships had never been health-checked. Two changes:
#
# - `prod-image-smoke` (below) builds all 14 `production` images and boots
#   the full production stack exactly as a deploy lays it out — including
#   the per-stack nginx and the TLS edge gateway — then checks real routes
#   through HTTPS (scripts/smoke-prod.sh, also `pnpm smoke:prod` locally), so
#   a crash-looping or misconfigured image or config is caught before main.
# - This workflow now runs on every PR touching source (apps/, packages/,
#   services/), not only Dockerfile-changing PRs — a source change can still
#   break the image (e.g. a config-validation regression the dev-target E2E
#   stack doesn't exercise the same way) — and the "Production Image Smoke"
#   status check is a required check (.github/rulesets/main-required-checks.json).
#
# ADS-1400: the workflow triggers on EVERY push/PR (no trigger-level `paths:`)
# so that required check always reports. A required check whose workflow is
# filtered out at the trigger level never reports — it sits at "Expected —
# waiting for status" forever and blocks every PR that touches no Docker path
# (docs/, scripts/, .github/, e2e/, …). The path scoping lives in the `changes`
# job below instead: the image build/scan/boot jobs are gated on it, and the
# always-running `prod-image-smoke-gate` job reports "Production Image Smoke"
# (passing when the boot job was skipped). Same pattern as schema-equivalence.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # DETECT CHANGES — ADS-1400: decides whether the image jobs below need to
  # run. These are the paths that used to be the workflow's trigger-level
  # `paths:` (ADS-1314: the canonical source list in
  # .github/workflow-source-paths.yml plus the Docker plumbing), plus this
  # workflow file so an edit to it validates itself. Anything else — docs,
  # scripts, .github/ (other than this file), e2e, nginx, … — cannot change an
  # image, so those jobs are skipped and the gate job below reports success.
  # ============================================================================
  changes:
    name: Detect Docker image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            docker:
              - 'apps/**'
              - 'packages/**'
              - 'services/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '**/Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
              # Root build inputs the Dockerfiles consume (workspace/turbo/
              # tsconfig bases) and docs/legal, which Dockerfile.service bakes
              # in and the smoke job checks via /api/v1/legal/terms. Without
              # these, a change to them alone would skip every image job and
              # the gate would report the required check green untested.
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'docs/legal/**'
              - '.github/workflows/docker.yml'
              # The production smoke test (prod-image-smoke) also boots both
              # nginx layers using the deploy scripts it reuses.
              - 'docker-bake.hcl'
              - 'nginx/**'
              - 'deploy/gateway/**'
              - 'scripts/smoke-prod.sh'
              - 'scripts/deploy-secrets.sh'
              - 'scripts/wait-for-services.sh'

  # ============================================================================
  # BUILD FRONTEND APPS — dev + production images for each app
  # ============================================================================
  build-apps:
    name: Build ${{ matrix.app }} Image
    needs: changes
    # Run when image-affecting paths changed, or on a manual run (an explicit
    # request to build, which change detection must not skip).
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, rescue]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Build development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.app
          target: development
          build-args: |
            APP_NAME=${{ matrix.app }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:${{ matrix.app }}-dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Push-only: the prod stage re-runs `tsc && vite build` inside Docker,
      # which ci.yml's test-frontend matrix already runs natively. Keep it
      # on main pushes as a final pre-deploy gate.
      - name: Build production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.app
          target: production
          build-args: |
            APP_NAME=${{ matrix.app }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:${{ matrix.app }}-prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ============================================================================
  # BUILD SERVICES — dev image on all triggers; prod image + Trivy scan on
  # all triggers (ADS-833: scan PRs so CVEs are caught before merge, not
  # after), EXCEPT that on a PR, each service's prod build+scan only runs
  # if that service's own image could actually have changed (ADS-1357): the
  # `changes` job's filter (ADS-1314/ADS-1400) is deliberately broad — any
  # source change under apps/**, packages/**, services/** runs this job — so
  # without this in-job filter, a frontend-only PR would rebuild and
  # Trivy-scan all 11 service images for no reason. See the per-service
  # filter step below.
  #
  # Replaces the CVE-scan coverage lost when the service.backend monolith
  # was deleted in #995 (the old `build-backend` job ran a single Trivy
  # scan against that one image). Each of the 11 microservice images is
  # now built from the shared Dockerfile.service and scanned independently
  # so a CVE in one service surfaces in the Security tab without being
  # masked by another image's findings (fail-fast: false).
  # ============================================================================
  build-services:
    name: Build ${{ matrix.service }} Image
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - notifications
          - pets
          - rescue
          - applications
          - chat
          - moderation
          - matching
          - audit
          - cms

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # ADS-1357: on a PR, only this service's prod build + Trivy scan need
      # to run if something that can actually affect its image changed —
      # its own service dir, a shared backend package it (or any service)
      # depends on, the service Dockerfile/dockerignore, the root build
      # config Dockerfile.service consumes (lockfile, workspace, turbo,
      # tsconfig bases, docs/legal), or this workflow file. Push/schedule/workflow_dispatch
      # always build+scan every service (see the `if:` on the gated steps
      # below). The `packages/*` list below is every shared package at least
      # one service's package.json depends on (checked against
      # services/*/package.json) — deliberately excludes the frontend-only
      # `lib.*` packages (lib.components, lib.api, …) that no service uses,
      # but the frontend-shared libs services DO use (lib.types,
      # lib.av-scan, lib.validation) are included.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: service-filter
        with:
          filters: |
            rebuild:
              - 'services/${{ matrix.service }}/**'
              - 'packages/authz/**'
              - 'packages/config-secrets/**'
              - 'packages/db/**'
              - 'packages/events/**'
              - 'packages/lib.av-scan/**'
              - 'packages/lib.types/**'
              - 'packages/lib.validation/**'
              - 'packages/observability/**'
              - 'packages/proto/**'
              - 'packages/scheduler/**'
              - 'packages/seed-faker/**'
              - 'packages/service-bootstrap/**'
              - 'packages/storage/**'
              - 'packages/test-utils/**'
              - 'packages/eslint-config-node/**'
              - 'Dockerfile.service'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'docs/legal/**'
              - '.github/workflows/docker.yml'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Log in to GHCR (for Trivy DB pulls)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: development
          build-args: |
            SERVICE=@adopt-dont-shop/service.${{ matrix.service }}
            SERVICE_DIR=services/${{ matrix.service }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:service-${{ matrix.service }}-dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Build the prod image so Trivy can scan it (ADS-833). ADS-1314 widened
      # the PR scope to match any source change (apps/**, packages/**,
      # services/**, …), not just Dockerfile-changing ones, so on a PR this
      # step (and the scan steps below) only run when `service-filter` found
      # a change that can affect THIS service's image (ADS-1357); push and
      # other non-PR triggers always build+scan every service.
      - name: Build production image
        if: github.event_name != 'pull_request' || steps.service-filter.outputs.rebuild == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.service
          target: production
          load: true
          build-args: |
            SERVICE=@adopt-dont-shop/service.${{ matrix.service }}
            SERVICE_DIR=services/${{ matrix.service }}
            BUILDKIT_INLINE_CACHE=1
          push: false
          tags: paragonjenko/adoptdontshop:service-${{ matrix.service }}-prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Export the just-built image to a tar so Trivy can scan it via --input
      # instead of pulling from the daemon, which is what lets the scan step
      # below skip mounting /var/run/docker.sock (ADS-1299 — that mount handed
      # a container root-equivalent control of the runner's Docker daemon).
      - name: Save production image for scanning
        if: github.event_name != 'pull_request' || steps.service-filter.outputs.rebuild == 'true'
        run: |
          docker save paragonjenko/adoptdontshop:service-${{ matrix.service }}-prod-${{ github.sha }} \
            -o trivy-image-${{ matrix.service }}.tar

      # Scan once to JSON with --ignore-unfixed (gate only on CVEs that have an
      # upstream patch — un-actionable ones shouldn't block PRs). `trivy convert`
      # then renders that report to the job log (table) and to SARIF (Security
      # tab) without re-scanning, and the final step fails the job if the report
      # contains any CRITICAL/HIGH. (--ignore-unfixed is a scan flag; `convert`
      # rejects it, so it must live on the `image` command.)
      #
      # The DB repositories are comma-separated fallbacks Trivy tries in order.
      # A single source fails the scan whenever that registry rate-limits the
      # runner (public.ecr.aws answering TOOMANYREQUESTS failed every
      # rebuilt service on PRs #1535/#1536), so each mirror is listed.
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request' || steps.service-filter.outputs.rebuild == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2 \
            -e TRIVY_JAVA_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1 \
            aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image \
              --input trivy-image-${{ matrix.service }}.tar \
              --format json \
              --output trivy-results-${{ matrix.service }}.json \
              --severity CRITICAL,HIGH \
              --ignore-unfixed

      - name: Render Trivy results (table to log + SARIF)
        if: always() && hashFiles(format('trivy-results-{0}.json', matrix.service)) != ''
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 convert --format table \
              trivy-results-${{ matrix.service }}.json
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 convert --format sarif \
              --output trivy-results-${{ matrix.service }}.sarif \
              trivy-results-${{ matrix.service }}.json

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-service-${{ matrix.service }}'

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        if: github.event_name != 'pull_request' || steps.service-filter.outputs.rebuild == 'true'
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 convert --exit-code 1 \
              --severity CRITICAL,HIGH \
              trivy-results-${{ matrix.service }}.json

  # ============================================================================
  # BUILD + PUBLISH SHARED DEV IMAGE (Dockerfile.dev)
  #
  # The local dev stack (docker-compose.dev.yml, driven by `pnpm docker:dev`)
  # uses one shared image that bakes a full workspace install. Publishing it to
  # GHCR means scripts/docker-dev.mjs can PULL it instead of building locally,
  # so most developers never run a build at all (the original network-flakiness
  # source). Built on every trigger whose `changes` filter matches, to catch
  # breakage; pushed only on main/develop pushes (PRs can't push to the shared
  # :latest tag).
  # ============================================================================
  build-dev-image:
    name: Build + Publish Dev Image
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR) dev image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.dev
          target: development
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ideasquared/adopt-dont-shop/dev:${{ github.sha }}
            ghcr.io/ideasquared/adopt-dont-shop/dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ============================================================================
  # PROD IMAGE SMOKE — ADS-1314 (P1-8): production images were built and
  # Trivy-scanned above but never booted, and this workflow was not a
  # required check — the exact artifact `deploy.yml` ships had never been
  # health-checked. This job boots the `production` target for the gateway,
  # two representative domain services (auth; notifications — the ADS-1301
  # P0 finding, config validation throwing under NODE_ENV=production) and one
  # frontend app against real Postgres/Redis/NATS/ClamAV containers, and
  # asserts `/health/ready` on each plus a real gateway route
  # (`GET /api/v1/legal/terms` — the second ADS-1301 P0, legal docs missing
  # from the image) before merge. `push: false` + `load: true`: images never
  # leave the runner — this is a smoke test, not a publish (release.yml /
  # deploy.yml own that).
  #
  # Rebuilds the same four images the build-apps/build-services matrix jobs
  # above already build — their outputs aren't otherwise available to this
  # job (cross-job image transfer would need a docker save/load artifact
  # round-trip for four images with no real benefit here) — reusing the
  # identical docker/build-push-action invocation shape. BuildKit's shared
  # GHA cache (same `cache-from`/`cache-to: type=gha` key space as the matrix
  # jobs above) makes the rebuild a near-total cache hit in the common case.
  # ============================================================================
  prod-image-smoke:
    name: Production Image Smoke (boot)
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # 14 images plus their build cache don't fit in the runner's default
      # free space; drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.0
            network=host
          # Bound concurrent build steps so 14 parallel `pnpm install`s don't
          # exhaust the runner's memory.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4

      # Same definition `pnpm smoke:prod` builds locally (docker-bake.hcl).
      - name: Build the 14 production images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7.5.0
        env:
          TAG: smoke
        with:
          source: .
          files: docker-bake.hcl
          targets: smoke
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max,ignore-error=true

      # Boots the full production stack (docker-compose.prod.yml as shipped,
      # per-stack nginx, edge gateway with a self-signed cert) and checks it
      # through TLS. See the script's header for what is and isn't covered;
      # it dumps container logs itself on failure and always tears down.
      - name: Run the production smoke test
        run: scripts/smoke-prod.sh --no-build

  # ============================================================================
  # PRODUCTION IMAGE SMOKE GATE — ADS-1400: the job that reports the required
  # "Production Image Smoke" context (.github/rulesets/main-required-checks.json).
  # It always runs, so the check reports on every PR — passing when the boot job
  # above was skipped because no image-affecting path changed — instead of the
  # PR sitting at "Expected — waiting for status". The boot job is deliberately
  # named "Production Image Smoke (boot)" so this is the only check run with the
  # required name. Keep the name below byte-identical to the ruleset's context.
  # ============================================================================
  prod-image-smoke-gate:
    name: Production Image Smoke
    needs: [changes, prod-image-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarise boot result
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.prod-image-smoke.result }}
        run: |
          # A failed change-detection job is a real CI-infra failure — surface
          # it rather than silently passing as "nothing to verify".
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Docker change-detection job result: $CHANGES"
            exit 1
          fi
          case "$RESULT" in
            success)
              echo "Production image smoke passed."
              ;;
            skipped)
              echo "Boot job skipped — no image-affecting changes to verify."
              ;;
            *)
              echo "::error::Production image smoke boot job result: $RESULT"
              exit 1
              ;;
          esac
