# Deploys ADS through ideaSquared/shipper (see ship.yaml): shipper's gate, then this repo's own
# deploy.yml (images, cosign, approvals, SSH, health gate — unchanged), then shipper's Discord
# report, which also updates the #ship-status board.
#
# - Staging: automatically once both CI and Docker (whose production image smoke test deploy.yml
#   also requires) pass on a push to main, or `ship deploy ads staging`.
# - Production: `ship deploy ads production` (or Actions → Ship → Run workflow → production). Shipper's
#   gate only accepts a commit that is already live on staging; deploy.yml then runs its own CI and
#   production-smoke gates and the production approval, as before.
#
# Emergency bypasses (skip_ci_check, skip_cosign_verify, allow_blind_deploy) stay on deploy.yml's
# own Run workflow form, where they are audited.
name: Ship

on:
  # Either can finish last, so both trigger this; `target` deploys only once both have passed on
  # the commit, which makes the second one to finish the run that deploys.
  workflow_run:
    workflows: [CI, Docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy main to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: ship-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  target:
    # A manual run deploys what was picked. A push run on main deploys staging once CI and Docker
    # have both passed on that commit, and only while it is still main's head (a newer commit
    # deploys itself when its own runs finish).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.environment }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "environment=$PICKED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RUN_SHA" != "$MAIN_SHA" ]; then
            echo "${RUN_SHA:0:7} is no longer main's head (${MAIN_SHA:0:7}); not deploying it."
            exit 0
          fi
          for workflow in ci.yml docker.yml; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$RUN_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')
            if [ "$conclusion" != "success" ]; then
              echo "$workflow on ${RUN_SHA:0:7} is $conclusion; the run that finishes last deploys."
              exit 0
            fi
          done
          echo "environment=staging" >> "$GITHUB_OUTPUT"

  gate:
    needs: target
    if: needs.target.outputs.environment != ''
    permissions:
      contents: read
      checks: read
      deployments: read
    uses: ideaSquared/shipper/.github/workflows/gate.yml@d0c19f9e3b3eb634f17ffd7cfec610d30883b1ec # v1 (shipper#10)
    with:
      environment: ${{ needs.target.outputs.environment }}
      # Same commit as the uses: line (ADS pins every action to a SHA, see workflows/README.md).
      shipper-ref: d0c19f9e3b3eb634f17ffd7cfec610d30883b1ec
    secrets: inherit

  deploy:
    needs: [target, gate]
    permissions:
      contents: read
      issues: write
      packages: write
      actions: read
      checks: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
    secrets: inherit

  report:
    needs: [target, gate, deploy]
    if: always() && needs.gate.result == 'success'
    permissions:
      contents: read
      deployments: read
    uses: ideaSquared/shipper/.github/workflows/report.yml@d0c19f9e3b3eb634f17ffd7cfec610d30883b1ec # v1 (shipper#10)
    with:
      environment: ${{ needs.target.outputs.environment }}
      outcome: ${{ needs.deploy.result }}
      shipper-ref: d0c19f9e3b3eb634f17ffd7cfec610d30883b1ec
    secrets: inherit
