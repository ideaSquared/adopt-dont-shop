packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'e2e'

allowBuilds:
  # Not allowlisted under pnpm 10 either; pnpm 12 fails on unreviewed build scripts, so deny them explicitly.
  '@firebase/util': false
  '@scarf/scarf': false
  '@bufbuild/buf': true
  '@sentry/node-cpu-profiler': true
  'core-js': true
  'esbuild': true
  'msw': true
  'protobufjs': true
  'sharp': true

overrides:
  'react': '19.3.1'
  'react-dom': '19.3.1'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  '@types/express': '^5.0.0'
  '@types/express-serve-static-core': '^5.0.0'
  'eslint-plugin-react>eslint': '$eslint'
  'react-zdog>react': '18.3.1'
  'react-zdog>react-dom': '18.3.1'
