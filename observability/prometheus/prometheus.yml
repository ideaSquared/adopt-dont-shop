global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules — committed in infra/prometheus/rules/ (ADS-806), loaded here
# (ADS-1041). The rules dir is bind-mounted at /etc/prometheus/rules by the dev
# `observability` profile and by docker-compose.observability.yml in prod/staging.
rule_files:
  - /etc/prometheus/rules/*.yml

# Route firing alerts to Alertmanager (ADS-1041). Alertmanager runs alongside
# Prometheus in the same stack (dev `observability` profile /
# docker-compose.observability.yml). If it is not running the rules still
# evaluate and show in the Prometheus UI; only routing/paging is unavailable.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Gateway — the single REST edge and the /metrics aggregation point
  # for the gateway's own HTTP + rate-limit metrics.
  - job_name: service-gateway
    static_configs:
      - targets: ['service-gateway:4000']
    metrics_path: /metrics

  # Microservices — each exposes /metrics on its HTTP health port
  # (distinct from its gRPC port). service.auth is the canonical example;
  # the other services follow the same createMicroserviceServer() pattern.
  - job_name: service-auth
    static_configs:
      - targets: ['service-auth:5002']
    metrics_path: /metrics

  - job_name: service-notifications
    static_configs:
      - targets: ['service-notifications:5001']
    metrics_path: /metrics

  - job_name: service-pets
    static_configs:
      - targets: ['service-pets:5003']
    metrics_path: /metrics

  - job_name: service-rescue
    static_configs:
      - targets: ['service-rescue:5004']
    metrics_path: /metrics

  - job_name: service-applications
    static_configs:
      - targets: ['service-applications:5005']
    metrics_path: /metrics

  # ADS-1052: service-chat was missing from the scrape config despite exposing
  # /metrics via the same createMicroserviceServer() path as every other service.
  - job_name: service-chat
    static_configs:
      - targets: ['service-chat:5006']
    metrics_path: /metrics

  - job_name: service-moderation
    static_configs:
      - targets: ['service-moderation:5007']
    metrics_path: /metrics

  - job_name: service-matching
    static_configs:
      - targets: ['service-matching:5008']
    metrics_path: /metrics

  - job_name: service-audit
    static_configs:
      - targets: ['service-audit:5009']
    metrics_path: /metrics

  # ADS-1052: service-cms was missing from the scrape config (same gap as chat).
  - job_name: service-cms
    static_configs:
      - targets: ['service-cms:5010']
    metrics_path: /metrics

  # Host / datastore / container exporters (ADS-1313). Only exist when the
  # docker-compose.observability.yml overlay is up — see that file's
  # node-exporter/cadvisor/postgres-exporter/redis-exporter services.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  # External synthetic probe (ADS-1307d) — blackbox_exporter's multi-target
  # pattern: the probed URL is a label on __address__, not the scrape target
  # itself; __address__ is relabelled to the exporter's own address after.
  # Replace the placeholder target(s) with the real public hostname(s) before
  # enabling this stack on a host (see docs/runbooks/observability-enable.md
  # §7).
  - job_name: blackbox-public-endpoints
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://REPLACE_WITH_PUBLIC_HOSTNAME/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
