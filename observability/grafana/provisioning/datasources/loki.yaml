apiVersion: 1

# Auto-provisioned Loki datasource. Grafana picks this up on boot via the
# bind-mount in docker-compose.yml (grafana service, observability profile).
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # ADS-1327: log -> trace correlation. packages/observability/src/
      # logger.ts stamps `trace_id` on every log line written inside an
      # active OTel span; this turns that field into a clickable link to
      # the matching trace in the Tempo datasource (uid: tempo, see
      # tempo.yaml) when viewing a log line in Explore.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: '${__value.raw}'
