# blackbox_exporter module config (ADS-1307d).
#
# `http_2xx` also probes TLS when the target URL is https:// — that's what
# populates `probe_ssl_earliest_cert_expiry`, which
# infra/prometheus/rules/tls-cert.yml's TlsCertificateExpiringSoon alerts on.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
