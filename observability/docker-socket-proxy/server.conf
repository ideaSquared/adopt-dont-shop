# ADS-1376: this is the only container with access to the real docker.sock
# (mounted into the docker-socket-proxy service; see docker-compose.
# observability.yml). An exact-path allow-list, not a URL-prefix one — a
# prefix-based ACL that merely toggles whole sections like "CONTAINERS" (as
# the tecnativa/docker-socket-proxy image does) also allows every other GET
# endpoint under that prefix, including `/containers/{id}/archive`, which
# can read arbitrary files — including any `/run/secrets/*` a compromised
# cAdvisor has no business reading — out of *any* other container on the
# host. Everything not explicitly listed below 403s, and `limit_except GET`
# denies every method but GET/HEAD even on the paths that are allowed.
#
# cAdvisor needs exactly:
#   - GET /containers/json           (container list)
#   - GET /containers/{id}/json      (inspect -> Aliases -> the `name` label
#                                      ContainerRestarting filters on)
#   - GET /info                      (container/docker/factory.go's
#                                      `Register` -> `ValidateInfo` refuses
#                                      to enable the Docker integration at
#                                      all without this succeeding first)
#   - GET /version                   (API version negotiation)
#   - GET /_ping                     (this container's own healthcheck)
#
# scripts/check-observability-mounts.mjs asserts this file keeps exactly
# this shape — don't widen it without updating that guard.

upstream docker_socket {
  server unix:/var/run/docker.sock;
}

server {
  listen 2375;

  location ~ ^(/v[0-9][0-9.]*)?/_ping$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://docker_socket;
  }

  location ~ ^(/v[0-9][0-9.]*)?/version$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://docker_socket;
  }

  location ~ ^(/v[0-9][0-9.]*)?/info$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://docker_socket;
  }

  location ~ ^(/v[0-9][0-9.]*)?/containers/json$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://docker_socket;
  }

  location ~ ^(/v[0-9][0-9.]*)?/containers/[^/]+/json$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://docker_socket;
  }

  location / {
    return 403;
  }
}
