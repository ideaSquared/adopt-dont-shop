# ADS-1376: `user root` is required here — not a privilege escalation, a
# necessity. The image's default nginx.conf runs worker processes (which do
# the actual proxying, hence the actual docker.sock connection) as the
# unprivileged `nginx` user, but /var/run/docker.sock on the host is
# root-owned, mode 660; a non-root, non-matching-group process gets EACCES
# connecting to it. Running as uid 0 grants the owner-match permission bits
# needed to open that one file — it does NOT undo this stack's `cap_drop:
# ALL` (no capabilities are granted either way: connecting to a unix socket
# is an ordinary permission-checked file operation, not a privileged
# syscall), so a compromised worker still can't do anything a dropped-
# capabilities root process can't already not do (mount, raw sockets,
# ptrace, module loading, etc. all still require capabilities this
# container doesn't have).
user root;
worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log off;
  include /etc/nginx/conf.d/*.conf;
}
