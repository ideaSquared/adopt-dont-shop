# Alertmanager routing for the deployed observability stack (ADS-1041 / ADS-1052 / ADS-1307).
#
# Routes the SLO alert rules (infra/prometheus/rules/, loaded by Prometheus) by
# their `severity` label. `critical` and `warning` both deliver to the
# ideasquared-bot Worker (`ads-bot`), which posts them to Discord: firing alerts
# with an @everyone ping, resolved notifications without one. The bot reads the
# severity from each alert's `severity` label, so one receiver serves both
# routes; the routes below differ only in timing. `deadman` pings an external
# dead-man's-switch service. There is no Slack/email/PagerDuty path, and
# Alertmanager no longer talks to Discord directly.
#
# Secrets are files, never inline in this file:
#   - ALERT_SECRET, the bearer token for the bot, is the `alert_secret` Docker
#     secret (secrets/alert_secret on the host, written by
#     scripts/deploy-secrets.sh and shared with service-ops). It is mounted at
#     /run/secrets/alert_secret and read via `credentials_file`.
#   - observability/alertmanager/secrets/deadman_webhook_url (gitignored,
#     mounted read-only at /etc/alertmanager/secrets/), read via `url_file`.
# Neither lands in `docker inspect`. The deadman file must exist before the
# container starts. Reload after editing with
# `docker compose kill -s HUP alertmanager` (or restart). See
# docs/runbooks/observability-enable.md §4 and docs/runbooks/README.md's
# severity section.

global:
  resolve_timeout: 5m

route:
  # Group alerts so a burst from one service arrives as one notification.
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Default sink — inert. Every alert also matches a child route below.
  receiver: 'ads-bot'
  routes:
    # The Watchdog alert (infra/prometheus/rules/watchdog.yml) always fires
    # with severity="none" — route it to the dead-man's-switch receiver
    # only, never to the bot. `continue: false` (the default) so it doesn't
    # also fall through to ads-bot.
    - matchers:
        - severity = "none"
      receiver: 'deadman'
      group_wait: 0s
      group_interval: 1m
      # Must be at most the dead-man's-switch service's configured "expected
      # every N minutes" period, or it declares the pipeline dead between
      # pings. Healthchecks.io/Cronitor default to a generous grace period,
      # but set this no looser than that check's period.
      repeat_interval: 5m
    - matchers:
        - severity = "critical"
      receiver: 'ads-bot'
      # Page fast and re-page more often for criticals.
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: 'ads-bot'

# Suppress a warning for the same alertname/job once its critical is already
# firing (e.g. don't send "high latency" warning while "service down" pages).
inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname', 'job']

receivers:
  # ---- CRITICAL + WARNING -> ideasquared-bot -> Discord --------------------
  # Body is Alertmanager's standard webhook JSON (version 4), unchanged. The
  # bot @everyone-pings on firing and stays quiet on resolved.
  - name: 'ads-bot'
    webhook_configs:
      - url: https://ideasquared-bot.idea-squared.workers.dev/alert/alertmanager/ads
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_secret

  # ---- Dead-man's switch (ADS-1307a) --------------------------------------
  # A generic webhook, not Discord: point it at a Healthchecks.io or
  # Cronitor "ping URL" (create a check there with a period matching
  # `repeat_interval` above and a grace period covering one missed cycle;
  # both services accept any POST body, so Alertmanager's default JSON
  # payload works unmodified). That external service — not this stack — is
  # what actually pages someone when the ping stops arriving, which is the
  # off-host signal a self-hosted, same-host monitoring stack cannot
  # generate for its own outage.
  - name: 'deadman'
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadman_webhook_url
        send_resolved: false
